<script>
/* =========================================================
   ALLINONESTOP - RETAILER PORTAL
   OPTIONAL FIELDS VERSION

   REQUIRED ONLY:
   1. UTR / Transaction Number
   2. Payment Screenshot

   SERVICE selection is logically required.
   All customer fields/documents are optional.
========================================================= */

const SUPABASE_URL =
  window.ALLINONESTOP_CONFIG.SUPABASE_URL;

const SUPABASE_PUBLISHABLE_KEY =
  window.ALLINONESTOP_CONFIG.SUPABASE_PUBLISHABLE_KEY;

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const SUBMIT_FUNCTION = "submit-application";

let services = [];
let loggedRetailer = null;
let selectedService = null;


/* =========================================================
   RETAILER EMAIL
========================================================= */

function retailerEmail(username) {
  return (
    username.trim().toLowerCase() +
    "@dixsmucrgnyuvudhymdj.supabase.co"
  );
}


/* =========================================================
   HOME
========================================================= */

function goHome() {
  window.location.href = "index.html";
}


/* =========================================================
   BACK
========================================================= */

function goBack() {
  if (document.referrer) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
}


/* =========================================================
   REMOVE ALL * EXCEPT UTR
========================================================= */

function setupOptionalFields() {

  /* Remove all existing required stars */
  document
    .querySelectorAll(".required")
    .forEach(el => {
      el.remove();
    });

  /* Add UTR star */
  const utrInput =
    document.getElementById("utrNumber");

  if (utrInput) {

    const label =
      utrInput.closest("div")?.querySelector("label");

    if (label) {

      label.innerHTML =
        'UTR / Transaction Number ' +
        '<span class="required">*</span>';

    }

  }
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const username =
    document
      .getElementById("username")
      .value
      .trim()
      .toUpperCase();

  const password =
    document
      .getElementById("password")
      .value;

  if (!username) {

    showStatus(
      "loginStatus",
      "Retailer ID / Username required.",
      "error"
    );

    return;
  }

  if (!password) {

    showStatus(
      "loginStatus",
      "Password required.",
      "error"
    );

    return;
  }

  const btn =
    document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "Logging in...";

  try {

    const internalEmail =
      retailerEmail(username);

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: internalEmail,
        password: password
      });

    if (error) {
      throw new Error(error.message);
    }

    if (!data || !data.user) {
      throw new Error(
        "Login failed. User account not found."
      );
    }

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,full_name,mobile,retailer_number,role"
        )
        .eq("id", data.user.id)
        .maybeSingle();

    if (profileError) {
      throw new Error(
        "Profile error: " +
        profileError.message
      );
    }

    if (
      !profile ||
      profile.role !== "retailer"
    ) {

      await supabaseClient.auth.signOut();

      throw new Error(
        "Retailer profile not found."
      );
    }

    loggedRetailer = {
      success: true,
      retailerId: profile.id,
      username: profile.retailer_number,
      retailerName: profile.full_name,
      mobile: profile.mobile
    };

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("applicationSection")
      .classList.remove("hidden");

    document
      .getElementById("logoutBtn")
      .style.display = "block";

    document
      .getElementById("retailerInfo")
      .textContent =
        (profile.full_name || "") +
        " | Retailer ID: " +
        (profile.retailer_number || "");

    await loadServices();

    setupOptionalFields();

  } catch (error) {

    showStatus(
      "loginStatus",
      "Login error: " +
        (error.message ||
          "Invalid login credentials."),
      "error"
    );

  } finally {

    btn.disabled = false;
    btn.textContent = "Login";

  }
}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices() {

  const select =
    document.getElementById("service");

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("services")
        .select(
          "id,name,amount,without_ration_amount,fields"
        )
        .eq("active", true)
        .order("name");

    if (error) {
      throw new Error(error.message);
    }

    services =
      (data || []).map(service => ({

        ...service,

        fields:
          Array.isArray(service.fields)
            ? service.fields
            : []

      }));

    select.innerHTML =
      '<option value="">Select Service</option>';

    services.forEach(service => {

      const option =
        document.createElement("option");

      option.value =
        service.id;

      option.textContent =
        service.name +
        " - ₹" +
        Number(service.amount || 0);

      select.appendChild(option);

    });

    if (!services.length) {

      showStatus(
        "mainStatus",
        "No services found in services table.",
        "error"
      );

    }

  } catch (error) {

    showStatus(
      "mainStatus",
      "Services load error: " +
        error.message,
      "error"
    );

  }
}


/* =========================================================
   SERVICE CHANGE
========================================================= */

function serviceChanged() {

  const id =
    document
      .getElementById("service")
      .value;

  selectedService =
    services.find(
      service =>
        String(service.id) === String(id)
    );

  const info =
    document.getElementById("serviceInfo");

  if (!selectedService) {

    info.classList.add("hidden");

    document.getElementById(
      "amount"
    ).value = "";

    renderFileFields([]);

    return;
  }

  let amount =
    Number(
      selectedService.amount || 0
    );

  const withoutRation =
    document.getElementById(
      "without_ration_card"
    ).value;

  if (
    withoutRation === "true" &&
    selectedService.without_ration_amount != null
  ) {

    amount =
      Number(
        selectedService.without_ration_amount
      );

  }

  document.getElementById(
    "amount"
  ).value = amount;

  info.classList.remove("hidden");

  info.innerHTML =
    "<strong>" +
    escapeHtml(selectedService.name) +
    "</strong><br>" +
    "Service Amount: ₹" +
    escapeHtml(amount);

  renderFileFields(
    selectedService.fields || []
  );
}


/* =========================================================
   WITHOUT RATION CARD
========================================================= */

document
  .getElementById("without_ration_card")
  .addEventListener(
    "change",
    function () {

      if (selectedService) {
        serviceChanged();
      }

    }
  );


/* =========================================================
   DOCUMENT FIELDS
========================================================= */

function renderFileFields(fields) {

  const container =
    document.getElementById("fileFields");

  container.innerHTML = "";


  /* ================================================
     PAYMENT SCREENSHOT
     ALWAYS SHOWN
     ALWAYS REQUIRED
  ================================================ */

  const paymentRow =
    document.createElement("div");

  paymentRow.className =
    "file-row";

  const paymentLabel =
    document.createElement("label");

  paymentLabel.innerHTML =
    'Payment Screenshot ' +
    '<span class="required">*</span>';

  const paymentInput =
    document.createElement("input");

  paymentInput.type = "file";

  paymentInput.id =
    "paymentScreenshot";

  paymentInput.accept =
    ".jpg,.jpeg,.png,.pdf";

  paymentRow.appendChild(
    paymentLabel
  );

  paymentRow.appendChild(
    paymentInput
  );

  container.appendChild(
    paymentRow
  );


  /* ================================================
     SERVICE DOCUMENTS
     ALL OPTIONAL
  ================================================ */

  const documentFields =
    fields.filter(field => {

      return (
        String(field).endsWith("_pdf") ||
        field === "photo" ||
        field === "signature" ||
        field === "lc_pdf" ||
        field === "aadhaar_photo" ||
        field === "aadhaar_pdf" ||
        field === "ration_card_pdf" ||
        field === "election_card_pdf" ||
        field === "pancard_pdf"
      );

    });


  if (!documentFields.length) {

    const note =
      document.createElement("p");

    note.textContent =
      "Service documents optional hain. Jo document available ho wahi upload karein.";

    container.appendChild(note);

    return;
  }


  documentFields.forEach(field => {

    const row =
      document.createElement("div");

    row.className =
      "file-row";

    const label =
      document.createElement("label");

    /* NO STAR HERE */

    label.textContent =
      formatFieldName(field);

    const input =
      document.createElement("input");

    input.type = "file";

    input.accept =
      ".pdf,.jpg,.jpeg,.png";

    input.dataset.field =
      field;

    row.appendChild(label);

    row.appendChild(input);

    container.appendChild(row);

  });
}


/* =========================================================
   FIELD NAME
========================================================= */

function formatFieldName(name) {

  return String(name)

    .replace(/_/g, " ")

    .replace(
      /\b\w/g,
      c => c.toUpperCase()
    );
}


/* =========================================================
   COLLECT CUSTOMER FIELDS
========================================================= */

function collectFields() {

  const fields = {};

  const ids = [

    "name_english",
    "name_gujarati",
    "father_name",
    "mother_name",
    "husband_name",
    "dob",
    "dob_year",
    "ration_card_number",
    "pan_number",
    "dl_number",
    "rc_number",
    "vehicle_number",
    "election_number",
    "aadhaar_number",
    "correction_type",
    "correct_name",
    "state",
    "district"

  ];

  ids.forEach(id => {

    const el =
      document.getElementById(id);

    if (el) {

      fields[id] =
        el.value.trim();

    }

  });

  fields.without_ration_card =
    document.getElementById(
      "without_ration_card"
    ).value === "true";

  return fields;
}


/* =========================================================
   FILE TO BASE64
========================================================= */

function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(reader.result);

      reader.onerror =
        () =>
          reject(
            new Error(
              "Could not read file."
            )
          );

      reader.readAsDataURL(file);

    }
  );
}


/* =========================================================
   COLLECT FILES
========================================================= */

async function collectFiles() {

  const files = {};


  /* ================================================
     PAYMENT SCREENSHOT
     REQUIRED
  ================================================ */

  const paymentInput =
    document.getElementById(
      "paymentScreenshot"
    );

  if (
    !paymentInput ||
    !paymentInput.files ||
    !paymentInput.files[0]
  ) {

    throw new Error(
      "Payment Screenshot required."
    );

  }

  const paymentFile =
    paymentInput.files[0];

  if (
    paymentFile.size >
    10 * 1024 * 1024
  ) {

    throw new Error(
      "Payment Screenshot is larger than 10 MB."
    );

  }

  files.payment_screenshot = {

    name:
      paymentFile.name,

    type:
      paymentFile.type,

    data:
      await fileToBase64(
        paymentFile
      )

  };


  /* ================================================
     OTHER SERVICE DOCUMENTS
     OPTIONAL
  ================================================ */

  const inputs =
    document.querySelectorAll(
      "#fileFields input[type=file][data-field]"
    );

  for (
    const input of inputs
  ) {

    if (
      !input.files ||
      !input.files[0]
    ) {

      /* OPTIONAL - SKIP */
      continue;

    }

    const file =
      input.files[0];

    if (
      file.size >
      10 * 1024 * 1024
    ) {

      throw new Error(
        file.name +
        " is larger than 10 MB."
      );

    }

    files[input.dataset.field] = {

      name:
        file.name,

      type:
        file.type,

      data:
        await fileToBase64(file)

    };

  }

  return files;
}


/* =========================================================
   SUBMIT APPLICATION
========================================================= */

async function submitApplication() {

  if (!loggedRetailer) {

    showStatus(
      "mainStatus",
      "Please login first.",
      "error"
    );

    return;
  }


  /* SERVICE IS REQUIRED */
  if (!selectedService) {

    showStatus(
      "mainStatus",
      "Please select a service.",
      "error"
    );

    return;
  }


  /* ================================================
     MOBILE OPTIONAL
  ================================================ */

  const customerMobile =
    document
      .getElementById(
        "customerMobile"
      )
      .value
      .trim();

  /*
     If mobile entered, validate it.
     If empty, continue.
  */

  if (
    customerMobile &&
    !/^[0-9]{10}$/.test(
      customerMobile
    )
  ) {

    showStatus(
      "mainStatus",
      "Mobile number must be 10 digits.",
      "error"
    );

    return;
  }


  /* ================================================
     UTR REQUIRED
  ================================================ */

  const utrNumber =
    document
      .getElementById(
        "utrNumber"
      )
      .value
      .trim();

  if (!utrNumber) {

    showStatus(
      "mainStatus",
      "UTR / Transaction Number required.",
      "error"
    );

    document
      .getElementById(
        "utrNumber"
      )
      .focus();

    return;
  }


  const btn =
    document.getElementById(
      "submitBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "Uploading & Submitting...";


  try {

    showStatus(
      "mainStatus",
      "Payment screenshot aur documents upload ho rahe hain...",
      "info"
    );


    /* Customer fields OPTIONAL */
    const fields =
      collectFields();


    /*
       Payment screenshot REQUIRED.
       Other documents OPTIONAL.
    */
    const files =
      await collectFiles();


    const customerEmail =
      document
        .getElementById(
          "customerEmail"
        )
        .value
        .trim();


    /* ================================================
       SUBMIT EDGE FUNCTION
    ================================================ */

    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        SUBMIT_FUNCTION,
        {
          body: {

            service_id:
              selectedService.id,

            customer_mobile:
              customerMobile || "",

            customer_email:
              customerEmail || "",

            utr_number:
              utrNumber,

            fields:
              fields,

            files:
              files

          }
        }
      );


    if (error) {

      throw new Error(
        error.message ||
        "Submit function failed."
      );

    }


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.message ||
        data?.error ||
        "Application submission failed."
      );

    }


    /* ================================================
       SUCCESS
    ================================================ */

    document.getElementById(
      "trNumber"
    ).textContent =
      data.trNumber ||
      data.applicationId ||
      "";


    document.getElementById(
      "trBox"
    ).style.display =
      "block";


    showStatus(
      "mainStatus",
      "Application successfully submitted.",
      "success"
    );


    btn.style.display =
      "none";


  } catch (error) {

    console.error(
      "SUBMIT ERROR:",
      error
    );

    showStatus(
      "mainStatus",
      error.message ||
      "Application submission failed.",
      "error"
    );

  } finally {

    btn.disabled = false;

    if (
      btn.style.display !== "none"
    ) {

      btn.textContent =
        "Submit Application";

    }

  }
}


/* =========================================================
   NEW APPLICATION
========================================================= */

function newApplication() {

  document
    .querySelectorAll(
      "#applicationSection input"
    )
    .forEach(input => {

      if (
        input.type !== "file"
      ) {

        input.value = "";

      }

    });


  document
    .querySelectorAll(
      "#applicationSection select"
    )
    .forEach(select => {

      select.selectedIndex = 0;

    });


  document
    .getElementById(
      "serviceInfo"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "fileFields"
    )
    .innerHTML = "";


  document
    .getElementById(
      "trBox"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "submitBtn"
    )
    .style
    .display = "inline-block";


  selectedService = null;


  showStatus(
    "mainStatus",
    "Ready for new application.",
    "info"
  );
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  try {

    await supabaseClient.auth.signOut();

  } catch (error) {

    console.warn(error);

  }

  loggedRetailer = null;

  location.reload();
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(id);

  if (!el) return;

  el.className =
    "status " + type;

  el.textContent =
    message;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   AUTO LOGIN
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  async function () {

    /* Remove unwanted stars */
    setupOptionalFields();


    try {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (!data.session) {
        return;
      }


      const {
        data: profile,
        error
      } =
        await supabaseClient

          .from("profiles")

          .select(
            "id,full_name,mobile,retailer_number,role"
          )

          .eq(
            "id",
            data.session.user.id
          )

          .maybeSingle();


      if (
        error ||
        !profile ||
        profile.role !== "retailer"
      ) {

        await supabaseClient.auth.signOut();

        return;
      }


      loggedRetailer = {

        success: true,

        retailerId:
          profile.id,

        username:
          profile.retailer_number,

        retailerName:
          profile.full_name,

        mobile:
          profile.mobile

      };


      document
        .getElementById(
          "loginSection"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "applicationSection"
        )
        .classList
        .remove("hidden");


      document
        .getElementById(
          "logoutBtn"
        )
        .style
        .display = "block";


      document
        .getElementById(
          "retailerInfo"
        )
        .textContent =
          (
            profile.full_name ||
            ""
          ) +
          " | Retailer ID: " +
          (
            profile.retailer_number ||
            ""
          );


      await loadServices();

      setupOptionalFields();


    } catch (error) {

      console.warn(
        "Session check error:",
        error
      );

    }

  }
);
</script>
