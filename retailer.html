<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retailer Login - AllInOneStop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      color: #172033;
    }

    .header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .header a {
      color: white;
      text-decoration: none;
      background: #2563eb;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 500px;
      margin: 50px auto;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .field {
      margin-bottom: 17px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #475569;
      color: white;
    }

    .message {
      padding: 12px;
      border-radius: 9px;
      margin-top: 15px;
      display: none;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .hidden {
      display: none !important;
    }

    .profile-grid,
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .profile-item {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
    }

    .profile-item small {
      display: block;
      color: #64748b;
      margin-bottom: 5px;
    }

    .profile-item strong {
      display: block;
      word-break: break-word;
    }

    .service-card {
      border: 1px solid #e2e8f0;
      padding: 18px;
      border-radius: 12px;
      margin-top: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .service-card:hover {
      border-color: #2563eb;
      transform: translateY(-1px);
    }

    .service-card.selected {
      border: 2px solid #2563eb;
      background: #eff6ff;
    }

    .service-name {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .service-price {
      color: #2563eb;
      font-weight: 700;
    }

    .upload-list {
      display: grid;
      gap: 12px;
    }

    .upload-box {
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px dashed #94a3b8;
    }

    .result-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .tr-number {
      font-size: 23px;
      font-weight: 800;
      color: #1d4ed8;
      word-break: break-word;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .profile-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .container {
        width: min(100% - 20px, 1100px);
        margin: 20px auto;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">AllInOneStop</div>

    <div>
      <a href="index.html">Home</a>
    </div>
  </header>


  <!-- LOGIN -->
  <main id="loginSection" class="container">

    <div class="card login-card">

      <h1>Retailer Login</h1>

      <div class="subtitle">
        Login using your Retailer ID / Username and password.
      </div>

      <form id="loginForm">

        <div class="field">
          <label for="username">
            Retailer ID / Username
          </label>

          <input
            type="text"
            id="username"
            autocomplete="username"
            required
            placeholder="RET-K4CFYQ"
          >
        </div>

        <div class="field">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
            placeholder="Enter password"
          >
        </div>

        <button
          type="submit"
          class="btn-primary"
          id="loginButton"
        >
          Login
        </button>

        <div id="loginMessage" class="message"></div>

      </form>

    </div>

  </main>


  <!-- RETAILER DASHBOARD -->
  <main id="dashboardSection" class="container hidden">

    <!-- PROFILE -->
    <section class="card">

      <div class="top-actions">
        <button
          class="btn-secondary"
          onclick="openTracking()"
        >
          Track Application
        </button>

        <button
          class="btn-danger"
          onclick="logout()"
        >
          Logout
        </button>
      </div>

      <h2>Retailer Dashboard</h2>

      <div class="profile-grid">

        <div class="profile-item">
          <small>Retailer ID</small>
          <strong id="profileRetailerId">-</strong>
        </div>

        <div class="profile-item">
          <small>Username</small>
          <strong id="profileUsername">-</strong>
        </div>

        <div class="profile-item">
          <small>Retailer Name</small>
          <strong id="profileName">-</strong>
        </div>

        <div class="profile-item">
          <small>Mobile</small>
          <strong id="profileMobile">-</strong>
        </div>

        <div class="profile-item">
          <small>Email</small>
          <strong id="profileEmail">-</strong>
        </div>

      </div>

    </section>


    <!-- APPLICATION -->
    <section class="card">

      <h2>New Application</h2>

      <div id="applicationMessage" class="message"></div>

      <div class="field">

        <label>
          Select Service
        </label>

        <div id="servicesList">
          Loading services...
        </div>

      </div>


      <div id="applicationForm" class="hidden">

        <div class="form-grid">

          <div class="field">
            <label>Customer Mobile *</label>

            <input
              type="tel"
              id="customerMobile"
              maxlength="15"
              placeholder="Customer mobile number"
            >
          </div>

          <div class="field">
            <label>Customer Email</label>

            <input
              type="email"
              id="customerEmail"
              placeholder="Email"
            >
          </div>

        </div>


        <div id="dynamicFields"></div>


        <div class="field">

          <label>
            UTR / Transaction Number *
          </label>

          <input
            type="text"
            id="utrNumber"
            placeholder="Enter payment UTR number"
          >

        </div>


        <div class="field">

          <label>
            Payment Amount
          </label>

          <input
            type="number"
            id="amount"
            min="1"
          >

        </div>


        <div id="uploadSection">

          <h3>Documents</h3>

          <div id="fileInputs" class="upload-list"></div>

        </div>


        <button
          type="button"
          class="btn-primary"
          id="submitButton"
          onclick="submitApplication()"
        >
          Submit Application
        </button>

        <div id="submitResult"></div>

      </div>

    </section>

  </main>


<script>
  /*
   * =====================================================
   * IMPORTANT
   * =====================================================
   *
   * Replace this URL with your deployed Google Apps Script
   * Web App URL.
   *
   * Example:
   *
   * https://script.google.com/macros/s/XXXXXXXX/exec
   *
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxhnoLmKisxVxU0XV5f7qy-9VylLmxxDkS86evmwLA6LoH0ou0nu0GGqs5f0FJUK4--Dg/exec";


  let currentRetailer = null;
  let services = [];
  let selectedService = null;


  /* =====================================================
     HELPERS
  ===================================================== */

  function showMessage(elementId, message, type) {

    const element =
      document.getElementById(elementId);

    if (!element) return;

    element.className =
      "message " + type;

    element.textContent =
      message || "";

  }


  function clearMessage(elementId) {

    const element =
      document.getElementById(elementId);

    if (!element) return;

    element.className =
      "message";

    element.textContent =
      "";

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getStoredRetailer() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "allinone_retailer"
        ) || "null"
      );

    } catch (err) {

      return null;

    }

  }


  function saveRetailer(data) {

    localStorage.setItem(
      "allinone_retailer",
      JSON.stringify(data)
    );

  }


  function clearRetailer() {

    localStorage.removeItem(
      "allinone_retailer"
    );

  }


  function ensureApiConfigured() {

    if (
      !API_URL ||
      API_URL.indexOf(
        "PASTE_YOUR"
      ) >= 0
    ) {

      alert(
        "Please set your Apps Script Web App URL in API_URL."
      );

      return false;

    }

    return true;

  }


  /* =====================================================
     API GET
  ===================================================== */

  async function apiGet(params) {

    if (!ensureApiConfigured()) {
      throw new Error(
        "API URL not configured."
      );
    }

    const query =
      new URLSearchParams(params);

    const response =
      await fetch(
        API_URL +
        "?" +
        query.toString()
      );

    const text =
      await response.text();

    let data;

    try {

      data =
        JSON.parse(text);

    } catch (err) {

      throw new Error(
        "Invalid API response: " +
        text.substring(0, 300)
      );

    }

    return data;

  }


  /* =====================================================
     API POST
  ===================================================== */

  async function apiPost(data) {

    if (!ensureApiConfigured()) {
      throw new Error(
        "API URL not configured."
      );
    }

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify(data)
        }
      );

    const text =
      await response.text();

    let result;

    try {

      result =
        JSON.parse(text);

    } catch (err) {

      throw new Error(
        "Invalid API response: " +
        text.substring(0, 300)
      );

    }

    return result;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage(
          "loginMessage"
        );

        const button =
          document.getElementById(
            "loginButton"
          );

        button.disabled = true;
        button.textContent =
          "Logging in...";

        try {

          const username =
            document
              .getElementById("username")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;

          const result =
            await apiPost({

              action:
                "retailerlogin",

              username:
                username,

              password:
                password

            });


          if (
            !result.success
          ) {

            throw new Error(
              result.message ||
              "Login failed."
            );

          }


          currentRetailer =
            result;

          saveRetailer(
            result
          );

          showDashboard();

        } catch (err) {

          showMessage(
            "loginMessage",
            err.message ||
              "Login failed.",
            "error"
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Login";

        }

      }
    );


  /* =====================================================
     SHOW DASHBOARD
  ===================================================== */

  function showDashboard() {

    document
      .getElementById(
        "loginSection"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "dashboardSection"
      )
      .classList
      .remove("hidden");


    renderProfile();

    loadServices();

  }


  /* =====================================================
     PROFILE
  ===================================================== */

  function renderProfile() {

    const data =
      currentRetailer || {};


    document
      .getElementById(
        "profileRetailerId"
      )
      .textContent =
      data.retailerId || "-";


    document
      .getElementById(
        "profileUsername"
      )
      .textContent =
      data.username || "-";


    document
      .getElementById(
        "profileName"
      )
      .textContent =
      data.retailerName || "-";


    document
      .getElementById(
        "profileMobile"
      )
      .textContent =
      data.mobile || "-";


    document
      .getElementById(
        "profileEmail"
      )
      .textContent =
      data.email || "-";

  }


  /* =====================================================
     LOAD SERVICES
  ===================================================== */

  async function loadServices() {

    const container =
      document.getElementById(
        "servicesList"
      );

    container.innerHTML =
      "Loading services...";


    try {

      const result =
        await apiGet({
          action: "services"
        });


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Unable to load services."
        );

      }


      services =
        result.services || [];


      renderServices();

    } catch (err) {

      container.innerHTML =
        "<div class='message error' style='display:block'>" +
        escapeHtml(
          err.message
        ) +
        "</div>";

    }

  }


  /* =====================================================
     RENDER SERVICES
  ===================================================== */

  function renderServices() {

    const container =
      document.getElementById(
        "servicesList"
      );


    if (
      !services.length
    ) {

      container.innerHTML =
        "No services available.";

      return;

    }


    container.innerHTML =
      services.map(
        function(service) {

          return `
            <div
              class="service-card"
              data-service-id="${escapeHtml(service.id)}"
              onclick="selectService('${escapeHtml(service.id)}')"
            >

              <div class="service-name">
                ${escapeHtml(service.name)}
              </div>

              <div class="service-price">
                ₹${Number(service.amount || 0)}
              </div>

            </div>
          `;

        }
      ).join("");

  }


  /* =====================================================
     SELECT SERVICE
  ===================================================== */

  function selectService(serviceId) {

    selectedService =
      services.find(
        function(service) {

          return service.id ===
            serviceId;

        }
      );


    if (!selectedService) {
      return;
    }


    document
      .querySelectorAll(
        ".service-card"
      )
      .forEach(
        function(card) {

          card.classList.toggle(
            "selected",
            card.dataset.serviceId ===
              serviceId
          );

        }
      );


    document
      .getElementById(
        "applicationForm"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "amount"
      )
      .value =
      selectedService.amount || "";


    renderDynamicFields(
      selectedService
    );

  }


  /* =====================================================
     DYNAMIC FIELDS
  ===================================================== */

  const FIELD_LABELS = {

    name_english:
      "Name (English)",

    name_gujarati:
      "Name (Gujarati)",

    father_name:
      "Father Name",

    mother_name:
      "Mother Name",

    husband_name:
      "Husband Name",

    correct_name:
      "Correct Name",

    dob:
      "Date of Birth",

    dob_year:
      "Birth Year",

    ration_card_number:
      "Ration Card Number",

    pan_number:
      "PAN Number",

    dl_number:
      "DL Number",

    rc_number:
      "RC Number",

    vehicle_number:
      "Vehicle Number",

    election_number:
      "Election Number",

    aadhaar_number:
      "Aadhaar Number",

    correction_type:
      "Correction Type",

    state:
      "State",

    district:
      "District"

  };


  function renderDynamicFields(service) {

    const container =
      document.getElementById(
        "dynamicFields"
      );


    const fields =
      service.fields || [];


    const normalFields =
      fields.filter(
        function(field) {

          return (
            field.indexOf("_pdf") < 0 &&
            field !== "photo" &&
            field !== "signature" &&
            field !== "without_ration_card" &&
            field !== "mobile" &&
            field !== "email"
          );

        }
      );


    container.innerHTML =
      normalFields.map(
        function(field) {

          const label =
            FIELD_LABELS[field] ||
            field
              .replace(/_/g, " ")
              .replace(
                /\b\w/g,
                function(char) {
                  return char.toUpperCase();
                }
              );


          const type =
            field === "dob"
              ? "date"
              : field === "dob_year"
              ? "number"
              : "text";


          return `
            <div class="field">
              <label>
                ${escapeHtml(label)}
              </label>

              <input
                type="${type}"
                id="field_${escapeHtml(field)}"
                data-field="${escapeHtml(field)}"
                placeholder="${escapeHtml(label)}"
              >
            </div>
          `;

        }
      ).join("");


    if (
      fields.includes(
        "without_ration_card"
      )
    ) {

      container.innerHTML += `
        <div class="field">
          <label>
            Ration Card Status
          </label>

          <select
            id="field_without_ration_card"
            data-field="without_ration_card"
          >
            <option value="false">
              With Ration Card
            </option>

            <option value="true">
              Without Ration Card
            </option>
          </select>
        </div>
      `;

    }


    renderFileInputs(
      fields
    );

  }


  /* =====================================================
     FILE INPUTS
  ===================================================== */

  function renderFileInputs(fields) {

    const container =
      document.getElementById(
        "fileInputs"
      );


    const fileFields =
      fields.filter(
        function(field) {

          return (
            field.endsWith("_pdf") ||
            field === "photo" ||
            field === "signature"
          );

        }
      );


    if (
      !fileFields.length
    ) {

      container.innerHTML =
        "<div style='color:#64748b'>No documents required.</div>";

      return;

    }


    container.innerHTML =
      fileFields.map(
        function(field) {

          const label =
            FIELD_LABELS[field] ||
            field
              .replace(/_/g, " ")
              .replace(
                /\b\w/g,
                function(char) {
                  return char.toUpperCase();
                }
              );


          return `
            <div class="upload-box">

              <label>
                ${escapeHtml(label)}
              </label>

              <input
                type="file"
                id="file_${escapeHtml(field)}"
                data-file-field="${escapeHtml(field)}"
                accept=".pdf,image/*"
              >

            </div>
          `;

        }
      ).join("");

  }


  /* =====================================================
     READ FILE AS BASE64
  ===================================================== */

  function readFileAsBase64(file) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function() {

            reject(
              new Error(
                "Unable to read file."
              )
            );

          };


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  /* =====================================================
     SUBMIT APPLICATION
  ===================================================== */

  async function submitApplication() {

    clearMessage(
      "applicationMessage"
    );


    if (!selectedService) {

      showMessage(
        "applicationMessage",
        "Please select a service.",
        "error"
      );

      return;

    }


    const customerMobile =
      document
        .getElementById(
          "customerMobile"
        )
        .value
        .trim();


    if (!customerMobile) {

      showMessage(
        "applicationMessage",
        "Customer mobile is required.",
        "error"
      );

      return;

    }


    const utrNumber =
      document
        .getElementById(
          "utrNumber"
        )
        .value
        .trim();


    if (!utrNumber) {

      showMessage(
        "applicationMessage",
        "UTR / Transaction Number is required.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "submitButton"
      );


    button.disabled = true;
    button.textContent =
      "Uploading & Submitting...";


    try {

      const fields = {};


      document
        .querySelectorAll(
          "#dynamicFields [data-field]"
        )
        .forEach(
          function(element) {

            fields[
              element.dataset.field
            ] =
              element.value;

          }
        );


      const files = {};


      const fileElements =
        document.querySelectorAll(
          "[data-file-field]"
        );


      for (
        const input of fileElements
      ) {

        if (
          !input.files ||
          !input.files[0]
        ) {

          continue;

        }


        const file =
          input.files[0];


        const data =
          await readFileAsBase64(
            file
          );


        files[
          input.dataset.fileField
        ] = {

          name:
            file.name,

          type:
            file.type,

          data:
            data

        };

      }


      const amount =
        Number(
          document
            .getElementById(
              "amount"
            )
            .value ||
          selectedService.amount
        );


      const result =
        await apiPost({

          action:
            "submitapplication",

          retailerId:
            currentRetailer.retailerId,

          retailerMobile:
            currentRetailer.mobile || "",

          customerMobile:
            customerMobile,

          email:
            document
              .getElementById(
                "customerEmail"
              )
              .value
              .trim(),

          serviceCode:
            selectedService.id,

          amount:
            amount,

          utrNumber:
            utrNumber,

          paymentStatus:
            "Pending",

          applicationStatus:
            "Received",

          fields:
            fields,

          files:
            files

        });


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Application submission failed."
        );

      }


      document
        .getElementById(
          "submitResult"
        )
        .innerHTML = `

          <div class="result-box">

            <div>
              Application submitted successfully.
            </div>

            <br>

            <div>
              Your TR Number:
            </div>

            <div class="tr-number">
              ${escapeHtml(
                result.trNumber ||
                result.tr_number ||
                result.applicationId
              )}
            </div>

            <br>

            <div>
              Please save this TR Number for tracking.
            </div>

            <br>

            <button
              class="btn-secondary"
              onclick="openTracking('${escapeHtml(
                result.trNumber ||
                result.tr_number ||
                result.applicationId
              )}')"
            >
              Track This Application
            </button>

          </div>

        `;


      document
        .getElementById(
          "applicationMessage"
        )
        .className =
        "message";


      resetApplicationForm();

    } catch (err) {

      showMessage(
        "applicationMessage",
        err.message ||
          "Application submission failed.",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Submit Application";

    }

  }


  /* =====================================================
     RESET
  ===================================================== */

  function resetApplicationForm() {

    document
      .getElementById(
        "customerMobile"
      )
      .value = "";


    document
      .getElementById(
        "customerEmail"
      )
      .value = "";


    document
      .getElementById(
        "utrNumber"
      )
      .value = "";


    document
      .getElementById(
        "dynamicFields"
      )
      .innerHTML = "";


    document
      .getElementById(
        "fileInputs"
      )
      .innerHTML = "";

  }


  /* =====================================================
     TRACKING
  ===================================================== */

  function openTracking(trNumber) {

    let url =
      "tracking.html";


    if (trNumber) {

      url +=
        "?trNumber=" +
        encodeURIComponent(
          trNumber
        );

    }


    window.location.href =
      url;

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  function logout() {

    clearRetailer();

    currentRetailer =
      null;

    window.location.reload();

  }


  /* =====================================================
     INIT
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const stored =
        getStoredRetailer();


      if (stored) {

        currentRetailer =
          stored;

        showDashboard();

      }

    }
  );

</script>

</body>
</html>
