<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://dixsmucrgnyuvudhymdj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Z5T2Fbbr0RPMZds67p7-9Q_Yw2-jMVn";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   GLOBAL USER
========================================================= */

let currentUser = null;


/* =========================================================
   DOM HELPER
========================================================= */

function $(id){

  return document.getElementById(id);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    });

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  element,
  text,
  isError = false
){

  if(!element){
    return;
  }

  element.innerHTML =
    '<div class="msg ' +
    (isError ? "error" : "") +
    '">' +
    escapeHtml(text) +
    '</div>';

}


/* =========================================================
   NORMALIZE RETAILER ID
========================================================= */

function normalizeRetailerId(value){

  return String(value || "")
    .trim()
    .toUpperCase();

}


/* =========================================================
   IMPORTANT:
   RETAILER ID -> INTERNAL SUPABASE EMAIL
========================================================= */

function retailerIdToEmail(retailerId){

  const id =
    normalizeRetailerId(retailerId);

  return (
    id.toLowerCase() +
    "@retailer.allinonestop.local"
  );

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const retailerId =
    normalizeRetailerId(
      $("retailerId").value
    );

  const password =
    $("retailerPassword").value;


  const message =
    $("loginMsg");

  const button =
    $("loginButton");


  if(!retailerId){

    showMessage(
      message,
      "Please enter Retailer ID.",
      true
    );

    return;
  }


  if(!password){

    showMessage(
      message,
      "Please enter password.",
      true
    );

    return;
  }


  if(!/^RET-[A-Z0-9]{6}$/.test(retailerId)){

    showMessage(
      message,
      "Invalid Retailer ID format. Example: RET-35BA6N",
      true
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ Logging in...";


  try{

    /*
      IMPORTANT FIX

      Admin function creates Auth user with:

      RET-ID@retailer.allinonestop.local

      Retailer enters only:

      RET-ID

      So we convert it here.
    */

    const internalEmail =
      retailerIdToEmail(
        retailerId
      );


    console.log(
      "Retailer ID:",
      retailerId
    );

    console.log(
      "Auth email:",
      internalEmail
    );


    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            internalEmail,

          password:
            password

        });


    if(error){

      console.error(
        "SUPABASE LOGIN ERROR:",
        error
      );

      throw new Error(
        "Login failed: " +
        error.message
      );

    }


    if(
      !data ||
      !data.user
    ){

      throw new Error(
        "Login failed. User was not returned."
      );

    }


    /*
      Check retailer profile
    */

    const {
      data:profile,
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,full_name,role,retailer_number,mobile"
        )
        .eq(
          "id",
          data.user.id
        )
        .maybeSingle();


    if(profileError){

      await supabaseClient.auth.signOut();

      throw new Error(
        "Profile check failed: " +
        profileError.message
      );

    }


    if(!profile){

      await supabaseClient.auth.signOut();

      throw new Error(
        "Retailer profile not found."
      );

    }


    if(
      profile.role !==
      "retailer"
    ){

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not a retailer account."
      );

    }


    /*
      Successful login
    */

    currentUser =
      data.user;


    openRetailerPanel(
      profile
    );


  }
  catch(error){

    console.error(
      "RETAILER LOGIN ERROR:",
      error
    );

    showMessage(
      message,
      error.message ||
      "Login failed.",
      true
    );

  }
  finally{

    button.disabled = false;

    button.textContent =
      "🔐 Login";

  }

}


/* =========================================================
   OPEN RETAILER PANEL
========================================================= */

function openRetailerPanel(
  profile
){

  $("loginBox")
    .classList
    .add("hidden");


  $("appBox")
    .classList
    .remove("hidden");


  const retailerNumber =
    profile.retailer_number ||
    "Retailer";


  const name =
    profile.full_name ||
    "Retailer";


  $("who").textContent =
    "👤 " +
    name +
    " • " +
    retailerNumber;

}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if(error){

      console.error(
        "SESSION ERROR:",
        error
      );

      return;

    }


    if(
      !data ||
      !data.session
    ){

      return;

    }


    const user =
      data.session.user;


    const {
      data:profile,
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,full_name,role,retailer_number,mobile"
        )
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if(
      profileError ||
      !profile
    ){

      await supabaseClient.auth.signOut();

      return;

    }


    if(
      profile.role !==
      "retailer"
    ){

      await supabaseClient.auth.signOut();

      return;

    }


    currentUser =
      user;


    openRetailerPanel(
      profile
    );

  }
  catch(error){

    console.error(
      "RESTORE ERROR:",
      error
    );

  }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    await supabaseClient.auth.signOut();

  }
  catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );

  }


  currentUser =
    null;


  $("appBox")
    .classList
    .add("hidden");


  $("loginBox")
    .classList
    .remove("hidden");


  $("retailerPassword")
    .value = "";


  $("loginMsg")
    .innerHTML = "";

}


/* =========================================================
   PRICE
========================================================= */

function updatePrice(){

  const value =
    $("service").value;


  if(!value){

    $("amount").value =
      "";

    $("amountDisplay").textContent =
      "₹0";

    return;

  }


  const parts =
    value.split("|");


  const serviceAmount =
    Number(parts[1] || 0);


  $("amount").value =
    serviceAmount;


  $("amountDisplay").textContent =
    "₹" +
    serviceAmount;

}


/* =========================================================
   GENERATE TR NUMBER
========================================================= */

function generateTRNumber(){

  const now =
    new Date();


  const date =
    now.toISOString()
      .slice(2,10)
      .replaceAll("-","");


  const random =
    Math.floor(
      100000 +
      Math.random() * 900000
    );


  return (
    "AIO-" +
    date +
    "-" +
    random
  );

}


/* =========================================================
   PDF UPLOAD
========================================================= */

async function uploadPDF(
  file,
  path
){

  if(!file){

    return null;

  }


  if(
    file.type !==
    "application/pdf"
  ){

    throw new Error(
      "Only PDF files are allowed."
    );

  }


  if(
    file.size >
    5 * 1024 * 1024
  ){

    throw new Error(
      "PDF must be 5 MB or smaller."
    );

  }


  const {
    error
  } =
    await supabaseClient.storage
      .from("documents")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:"application/pdf"
        }
      );


  if(error){

    throw error;

  }


  return path;

}


/* =========================================================
   SUBMIT APPLICATION
========================================================= */

async function submitApplication(){

  const message =
    $("appMsg");

  const button =
    $("submitButton");


  try{

    if(!currentUser){

      throw new Error(
        "Login required."
      );

    }


    const nameEn =
      $("nameEn")
        .value
        .trim();


    const nameGu =
      $("nameGu")
        .value
        .trim();


    const dob =
      $("dob")
        .value;


    const mobile =
      $("mobile")
        .value
        .trim();


    const serviceValue =
      $("service")
        .value;


    const rationFile =
      $("ration")
        .files[0];


    const aadhaarFile =
      $("aadhaar")
        .files[0];


    /* =========================
       VALIDATION
    ========================= */

    if(!nameEn){

      throw new Error(
        "Name as per Aadhaar is required."
      );

    }


    if(!/^\d{10}$/.test(mobile)){

      throw new Error(
        "Mobile number must be exactly 10 digits."
      );

    }


    if(!serviceValue){

      throw new Error(
        "Please select a service."
      );

    }


    const parts =
      serviceValue.split("|");


    const serviceName =
      parts[0];


    const serviceAmount =
      Number(parts[1] || 0);


    if(!serviceName){

      throw new Error(
        "Invalid service selected."
      );

    }


    /* =========================
       BUTTON
    ========================= */

    button.disabled = true;

    button.textContent =
      "⏳ Submitting...";


    showMessage(
      message,
      "Uploading documents and creating application..."
    );


    /* =========================
       TR NUMBER
    ========================= */

    const trNumber =
      generateTRNumber();


    /* =========================
       PDF PATHS
    ========================= */

    let rationPath =
      null;

    let aadhaarPath =
      null;


    if(rationFile){

      rationPath =
        await uploadPDF(
          rationFile,
          currentUser.id +
          "/" +
          trNumber +
          "-ration.pdf"
        );

    }


    if(aadhaarFile){

      aadhaarPath =
        await uploadPDF(
          aadhaarFile,
          currentUser.id +
          "/" +
          trNumber +
          "-aadhaar.pdf"
        );

    }


    /* =========================
       INSERT APPLICATION
    ========================= */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("applications")
        .insert({

          tr_number:
            trNumber,

          retailer_id:
            currentUser.id,

          customer_name_en:
            nameEn,

          customer_name_gu:
            nameGu || null,

          dob:
            dob || null,

          mobile:
            mobile,

          service_name:
            serviceName,

          amount:
            serviceAmount,

          ration_pdf_path:
            rationPath,

          aadhaar_pdf_path:
            aadhaarPath

        })
        .select()
        .single();


    if(error){

      throw error;

    }


    console.log(
      "APPLICATION CREATED:",
      data
    );


    /* =========================
       SUCCESS
    ========================= */

    showMessage(
      message,
      "Application submitted successfully.\n\nTR Number: " +
      trNumber,
      false
    );


    /* =========================
       RESET FORM
    ========================= */

    $("nameEn").value =
      "";

    $("nameGu").value =
      "";

    $("dob").value =
      "";

    $("mobile").value =
      "";

    $("service").value =
      "";

    $("amount").value =
      "";

    $("amountDisplay").textContent =
      "₹0";

    $("ration").value =
      "";

    $("aadhaar").value =
      "";


    message.innerHTML +=
      '<div class="tr-box">' +
      '✅ Application Created<br>' +
      'TR Number: ' +
      escapeHtml(trNumber) +
      '</div>';


  }
  catch(error){

    console.error(
      "APPLICATION ERROR:",
      error
    );


    showMessage(
      message,
      error.message ||
      "Application submission failed.",
      true
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "📤 Submit Application";

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth
  .onAuthStateChange(
    function(event,session){

      console.log(
        "Auth event:",
        event
      );

      if(
        event ===
        "SIGNED_OUT"
      ){

        currentUser =
          null;

      }

    }
  );


/* =========================================================
   INITIALIZE
========================================================= */

restoreSession();

</script>
