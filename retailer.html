<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AllInOneStop Retailer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#6366f120,transparent 30%),
    radial-gradient(circle at 90% 10%,#06b6d420,transparent 30%),
    linear-gradient(135deg,#eef2ff,#f8fbff 50%,#ecfeff);
  color:#172033;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.wrap{
  width:min(1180px,calc(100% - 24px));
  margin:20px auto;
}

.box{
  background:rgba(255,255,255,.97);
  border-radius:22px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 15px 45px rgba(38,48,80,.10);
  border:1px solid #fff;
}

.hidden{
  display:none!important;
}

h1,h2,h3{
  margin-top:0;
}

h1{
  color:#4338ca;
}

h2{
  color:#172033;
}

p{
  color:#667085;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#344054;
  margin-bottom:7px;
}

.required{
  color:#dc2626;
}

input,
select,
textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  background:#fff;
  margin-bottom:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:2px solid #c7d2fe;
  border-color:#6366f1;
}

button,
.btn{
  padding:12px 17px;
  border-radius:12px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#5b5cf0,#287cff);
  text-decoration:none;
  display:inline-block;
}

button:hover,
.btn:hover{
  box-shadow:0 8px 20px rgba(54,88,255,.20);
}

.secondary{
  background:#475467;
}

.success-btn{
  background:linear-gradient(135deg,#059669,#10b981);
}

.danger{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.full{
  grid-column:1/-1;
}

.section-title{
  background:linear-gradient(135deg,#eef2ff,#eff6ff);
  border:1px solid #dbe4ff;
  color:#1d4ed8;
  padding:13px 16px;
  border-radius:14px;
  font-size:17px;
  font-weight:900;
  margin:20px 0;
}

.hint{
  font-size:12px;
  color:#667085;
  margin-top:-7px;
  margin-bottom:14px;
}

.msg{
  padding:13px;
  border-radius:12px;
  margin-top:14px;
  background:#ecfdf3;
  color:#087443;
  font-size:14px;
  font-weight:700;
  white-space:pre-wrap;
  word-break:break-word;
}

.msg.error{
  background:#fef2f2;
  color:#b42318;
}

.msg.warning{
  background:#fffbeb;
  color:#92400e;
}

.login-box{
  max-width:520px;
  margin:70px auto;
}

.login-icon{
  width:70px;
  height:70px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  color:#fff;
  font-size:34px;
  margin-bottom:18px;
}

.profile{
  background:#eef2ff;
  border:1px solid #dbe4ff;
  padding:12px 15px;
  border-radius:13px;
  color:#3730a3;
  font-weight:800;
}

.service-select-box{
  background:
    linear-gradient(135deg,#ffffff,#f8faff);
  border:2px solid #e0e7ff;
}

.service-select{
  font-size:17px;
  font-weight:800;
  border:2px solid #6366f1;
}

.work-box{
  margin-top:15px;
  padding:18px;
  background:#f8fafc;
  border:1px solid #e4e7ec;
  border-radius:16px;
}

.work-select{
  font-weight:800;
  border:2px solid #94a3b8;
}

.service-card{
  border:1px solid #e4e7ec;
  border-radius:17px;
  padding:18px;
  background:#fff;
  margin-top:18px;
}

.price-box{
  background:linear-gradient(135deg,#ecfdf3,#f0fdf4);
  border:1px solid #a7f3d0;
  border-radius:16px;
  padding:17px;
  margin-top:20px;
}

.price{
  font-size:30px;
  font-weight:900;
  color:#047857;
}

.qr-box{
  margin-top:18px;
  background:#fff;
  border:2px dashed #cbd5e1;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.qr-box img{
  width:230px;
  height:230px;
  object-fit:contain;
  border-radius:12px;
  border:1px solid #e5e7eb;
  padding:8px;
  background:#fff;
}

.upi{
  font-weight:900;
  color:#4338ca;
  font-size:16px;
}

.payment-note{
  background:#fff7ed;
  color:#9a3412;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  margin-top:12px;
}

.doc{
  background:#f8fafc;
  border:1px solid #e4e7ec;
  padding:14px;
  border-radius:13px;
  margin-bottom:14px;
}

.doc label{
  margin-bottom:8px;
}

.file-required{
  color:#dc2626;
  font-weight:900;
}

.file-optional{
  color:#667085;
  font-weight:700;
}

.tr-box{
  text-align:center;
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  border:2px solid #818cf8;
  border-radius:18px;
  padding:24px;
  margin-top:18px;
}

.tr-number{
  font-size:30px;
  font-weight:900;
  color:#4338ca;
  letter-spacing:1px;
  margin:10px 0;
}

.table-wrap{
  overflow-x:auto;
  border:1px solid #eaecf0;
  border-radius:14px;
  margin-top:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eaecf0;
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}

th{
  background:#f8fafc;
  color:#475467;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
  color:#4338ca;
  font-size:12px;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#667085;
  padding:25px;
}

.small{
  font-size:12px;
}

hr{
  border:0;
  border-top:1px solid #eaecf0;
  margin:22px 0;
}

@media(max-width:750px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .box{
    padding:17px;
  }

  .wrap{
    width:min(100% - 14px,1180px);
  }

  .login-box{
    margin:25px auto;
  }
}
</style>
</head>

<body>

<div class="wrap">

<!-- ================= LOGIN ================= -->

<div class="box login-box" id="loginBox">

  <div class="login-icon">🔐</div>

  <h1>Retailer Login</h1>

  <p>AllInOneStop Retailer Portal</p>

  <label for="loginId">
    Retailer ID / Email <span class="required">*</span>
  </label>

  <input
    id="loginId"
    type="text"
    placeholder="RET-XXXXXX or Email"
    autocomplete="username"
  >

  <label for="loginPassword">
    Password <span class="required">*</span>
  </label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <div class="actions">

    <button
      type="button"
      id="loginBtn"
      onclick="login()"
    >
      🔐 Login
    </button>

    <a
      class="btn secondary"
      href="index.html"
    >
      🏠 Home
    </a>

  </div>

  <div id="loginMessage"></div>

</div>


<!-- ================= RETAILER APP ================= -->

<div id="app" class="hidden">

  <!-- HEADER -->

  <div class="box">

    <div class="top">

      <div>

        <h1>🧾 AllInOneStop</h1>

        <div class="profile" id="retailerProfile">
          Retailer
        </div>

      </div>

      <div class="actions">

        <button
          type="button"
          class="secondary"
          onclick="showHistory()"
        >
          📋 My Applications
        </button>

        <a
          class="btn secondary"
          href="index.html"
        >
          🏠 Home
        </a>

        <button
          type="button"
          class="secondary"
          onclick="logout()"
        >
          🚪 Logout
        </button>

      </div>

    </div>

  </div>


  <!-- ================= NEW APPLICATION ================= -->

  <div id="applicationPage">

    <div class="box">

      <h2>➕ New Application</h2>

      <p>
        पहले Service चुनें। उसके बाद केवल उसी Service का required form दिखाई देगा।
      </p>

      <!-- SERVICE -->

      <div class="service-select-box service-card">

        <label for="serviceSelect">
          1. Select Service <span class="required">*</span>
        </label>

        <select
          id="serviceSelect"
          class="service-select"
          onchange="serviceChanged()"
        >

          <option value="">
            -- Select Service --
          </option>

          <option value="ration">
            🪪 Ration Card Services
          </option>

          <option value="pan">
            🪪 PAN Card Services
          </option>

          <option value="election">
            🗳️ Election Card Services
          </option>

          <option value="dl">
            🚗 DL Services
          </option>

          <option value="rc">
            🚘 RC Services
          </option>

          <option value="lms">
            📜 LMS Certificate
          </option>

        </select>

      </div>


      <!-- WORK -->

      <div
        id="workBox"
        class="work-box hidden"
      >

        <label for="workSelect">
          2. Select Work <span class="required">*</span>
        </label>

        <select
          id="workSelect"
          class="work-select"
          onchange="workChanged()"
        >

          <option value="">
            -- Select Work --
          </option>

        </select>

      </div>


      <!-- DYNAMIC FORM -->

      <div id="dynamicForm"></div>

      <div id="paymentSection"></div>

      <div id="submitSection"></div>

      <div id="applicationMessage"></div>

      <div id="successSection"></div>

    </div>

  </div>


  <!-- ================= HISTORY ================= -->

  <div
    id="historyPage"
    class="hidden"
  >

    <div class="box">

      <div class="top">

        <div>
          <h2>📋 My Applications</h2>
          <p>आपके द्वारा submit की गई applications</p>
        </div>

        <button
          type="button"
          onclick="showNewApplication()"
        >
          ➕ New Application
        </button>

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>TR Number</th>
              <th>Service</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Date</th>
            </tr>

          </thead>

          <tbody id="historyRows">

            <tr>
              <td colspan="6" class="empty">
                Loading...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

</div>

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

      const map={
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      };

      return map[char];

    });

}

/* =========================================================
   RENDER FIELD
========================================================= */

function renderField(
  key,
  field
){

  const required=
    field.required;

  const star=
    required
      ? '<span class="required">*</span>'
      : "";

  let html=
    '<div class="'+
    (
      field.type==="file"
        ? "full"
        : ""
    )+
    '">';

  html+=
    '<label for="field-'+
    key+
    '">'+
    escapeHtml(field.label)+
    " "+
    star+
    "</label>";

  if(field.type==="select"){

    html+=
      '<select id="field-'+
      key+
      '" '+
      (
        required
          ? "required"
          : ""
      )+
      ">";

    html+=
      '<option value="">-- Select --</option>';

    (field.options||[]).forEach(
      option=>{

        html+=
          '<option value="'+
          escapeHtml(option)+
          '">'+
          escapeHtml(option)+
          "</option>";

      }
    );

    html+="</select>";

  }
  else if(field.type==="file"){

    html+=
      '<div class="doc">'+

      '<input '+
      'id="field-'+
      key+
      '" '+
      'type="file" '+
      (
        field.accept
          ? 'accept="'+
            escapeHtml(field.accept)+
            '" '
          : ""
      )+
      (
        required
          ? "required"
          : ""
      )+
      ">"+

      (
        required
          ? '<div class="small file-required">Required document</div>'
          : '<div class="small file-optional">Optional document</div>'
      )+

      "</div>";

  }
  else{

    html+=
      '<input '+
      'id="field-'+
      key+
      '" '+
      'type="'+
      escapeHtml(field.type)+
      '" '+
      (
        field.placeholder
          ? 'placeholder="'+
            escapeHtml(field.placeholder)+
            '" '
          : ""
      )+
      (
        field.maxlength
          ? 'maxlength="'+
            field.maxlength+
            '" '
          : ""
      )+
      (
        required
          ? "required "
          : ""
      )+
      ">";

  }

  html+="</div>";

  return html;

}

/* =========================================================
   VALIDATE
========================================================= */

function validateApplication(){

  const service=
    document.getElementById(
      "serviceSelect"
    ).value;

  const workKey=
    document.getElementById(
      "workSelect"
    ).value;

  if(!service){

    throw new Error(
      "Please select a service."
    );

  }

  if(!workKey){

    throw new Error(
      "Please select work."
    );

  }

  const work=
    SERVICES[service].works[workKey];

  const values={};
  const files={};

  for(
    const fieldKey of work.fields
  ){

    const field=
      FIELD_DEFINITIONS[fieldKey];

    if(!field)continue;

    const element=
      document.getElementById(
        "field-"+fieldKey
      );

    if(!element)continue;

    if(field.type==="file"){

      const file=
        element.files?.[0];

      if(
        field.required &&
        !file
      ){

        throw new Error(
          field.label+
          " is required."
        );

      }

      if(file){

        files[fieldKey]=file;

      }

    }
    else{

      const value=
        element.value.trim();

      if(
        field.required &&
        !value
      ){

        throw new Error(
          field.label+
          " is required."
        );

      }

      values[fieldKey]=value;

    }

  }


  const mobile=
    values.mobile;

  if(
    mobile &&
    !/^\d{10}$/.test(mobile)
  ){

    throw new Error(
      "Mobile number must be exactly 10 digits."
    );

  }


  const aadhaar=
    values.aadhaarNumber;

  if(
    aadhaar &&
    !/^\d{12}$/.test(aadhaar)
  ){

    throw new Error(
      "Aadhaar number must be exactly 12 digits."
    );

  }


  const pan=
    values.panNumber;

  if(
    pan &&
    !/^[A-Za-z]{5}\d{4}[A-Za-z]$/.test(pan)
  ){

    throw new Error(
      "Please enter a valid PAN number."
    );

  }


  const dobYear=
    values.dobYear;

  if(
    dobYear &&
    !/^\d{4}$/.test(dobYear)
  ){

    throw new Error(
      "DOB Year must be 4 digits."
    );

  }


  const utr=
    document
      .getElementById("utrNumber")
      ?.value
      ?.trim();

  if(!utr){

    throw new Error(
      "UTR / Transaction Number is required."
    );

  }


  const paymentScreenshot=
    document
      .getElementById(
        "paymentScreenshot"
      )
      ?.files?.[0];

  if(!paymentScreenshot){

    throw new Error(
      "Payment screenshot is required."
    );

  }


  return {
    service,
    workKey,
    work,
    values,
    files,
    utr,
    paymentScreenshot
  };

}


/* =========================================================
   TR NUMBER
========================================================= */

function generateTRNumber(){

  const now=
    new Date();

  const datePart=
    String(
      now.getFullYear()
    ).slice(-2)+
    String(
      now.getMonth()+1
    ).padStart(2,"0")+
    String(
      now.getDate()
    ).padStart(2,"0");

  const random=
    Math.floor(
      100000+
      Math.random()*900000
    );

  return "TR-"+datePart+"-"+random;

}


/* =========================================================
   FILE UPLOAD
========================================================= */

async function uploadFile(
  file,
  folder,
  trNumber
){

  if(!file){
    return null;
  }

  /*
    Existing Supabase Storage bucket:
    application-documents

    Agar bucket private/public dono ho,
    upload path save hoga.
  */

  const cleanName=
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

  const path=
    folder+
    "/"+
    trNumber+
    "/"+
    Date.now()+
    "_"+
    cleanName;

  const {
    error
  }=
    await supabaseClient.storage
      .from("application-documents")
      .upload(
        path,
        file,
        {
          upsert:false
        }
      );

  if(error){

    throw new Error(
      "Document upload failed for "+
      file.name+
      ": "+
      error.message+
      "\n\nSupabase Storage में 'application-documents' bucket होना चाहिए."
    );

  }

  return path;

}


/* =========================================================
   SUBMIT APPLICATION
========================================================= */

async function submitApplication(){

  const button=
    document.getElementById(
      "submitBtn"
    );

  if(!button)return;

  button.disabled=true;
  button.textContent=
    "⏳ Submitting...";

  try{

    if(!currentUser){

      throw new Error(
        "Session expired. Please login again."
      );

    }

    const form=
      validateApplication();

    const trNumber=
      generateTRNumber();

    const serviceName=
      SERVICES[
        form.service
      ].name;

    const workName=
      form.work.name;

    const amount=
      form.work.amount;


    /* =========================
       UPLOAD DOCUMENTS
    ========================= */

    const uploadedFiles={};

    for(
      const [key,file]
      of Object.entries(
        form.files
      )
    ){

      uploadedFiles[key]=
        await uploadFile(
          file,
          currentProfile
            ?.retailer_number||
            currentUser.id,
          trNumber
        );

    }


    /* =========================
       PAYMENT SCREENSHOT
    ========================= */

    uploadedFiles.paymentScreenshot=
      await uploadFile(
        form.paymentScreenshot,
        currentProfile
          ?.retailer_number||
          currentUser.id,
        trNumber
      );


    /*
      Existing applications table
      में known columns use किए जा रहे हैं।

      बाकी service-specific data
      remark में structured JSON के रूप में save होगा।
    */

    const details={
      retailer_id:
        currentProfile?.retailer_number||
        "",

      retailer_name:
        currentProfile?.full_name||
        "",

      service:
        serviceName,

      work:
        workName,

      amount:
        amount,

      fields:
        form.values,

      documents:
        uploadedFiles,

      utr:
        form.utr,

      submitted_at:
        new Date().toISOString()
    };


    const {
      data,
      error
    }=
      await supabaseClient
        .from("applications")
        .insert({

          tr_number:
            trNumber,

          service_name:
            serviceName+
            " - "+
            workName,

          amount:
            amount,

          payment_status:
            "Paid",

          application_status:
            "Received",

          remark:
            JSON.stringify(
              details
            )

        })
        .select()
        .single();


    if(error){

      console.error(
        "APPLICATION INSERT ERROR:",
        error
      );

      throw new Error(
        "Application save failed: "+
        error.message
      );

    }


    /* =========================
       SUCCESS
    ========================= */

    showMessage(
      "applicationMessage",
      "Application submitted successfully."
    );


    document.getElementById(
      "successSection"
    ).innerHTML=

      '<div class="tr-box">'+

        '<div class="small">'+
          "Application Submitted Successfully"+
        "</div>"+

        '<div class="tr-number">'+
          escapeHtml(trNumber)+
        "</div>"+

        '<div>'+
          escapeHtml(serviceName)+
          "<br>"+
          escapeHtml(workName)+
        "</div>"+

        '<div class="price" style="margin-top:10px">'+
          "₹"+
          amount+
        "</div>"+

        '<div class="actions" style="justify-content:center;margin-top:18px">'+

          '<button '+
            'type="button" '+
            'onclick="copyTR(\''+
            escapeHtml(trNumber)+
            '\')"'+
          '>'+
            "📋 Copy TR Number"+
          "</button>"+

          '<button '+
            'type="button" '+
            'class="secondary" '+
            'onclick="showHistory()"'+
          '>'+
            "📋 My Applications"+
          "</button>"+

        "</div>"+

      "</div>";


    /*
      New application के लिए form reset.
    */

    document.getElementById(
      "serviceSelect"
    ).value="";

    document.getElementById(
      "workSelect"
    ).innerHTML=
      '<option value="">-- Select Work --</option>';

    document.getElementById(
      "workBox"
    ).classList.add("hidden");

    document.getElementById(
      "dynamicForm"
    ).innerHTML="";

    document.getElementById(
      "paymentSection"
    ).innerHTML="";

    document.getElementById(
      "submitSection"
    ).innerHTML="";


  }
  catch(error){

    console.error(
      "SUBMIT APPLICATION ERROR:",
      error
    );

    showMessage(
      "applicationMessage",
      error.message||
      "Application submission failed.",
      true
    );

  }

    const currentButton=
      document.getElementById(
        "submitBtn"
      );

    if(currentButton){

      currentButton.disabled=false;

      currentButton.textContent=

    }

  }

}

async function loadHistory(){

  const rows=
    document.getElementById(
      "historyRows"
    );

  rows.innerHTML=
    '<tr><td colspan="6" class="empty">Loading...</td></tr>';

  try{

    /*
      Existing applications table में
      retailer की पहचान remark JSON में save है।
    */

    const {
      data,
      error
    }=
      await supabaseClient
        .from("applications")
        .select(
          "tr_number,service_name,amount,payment_status,application_status,remark,created_at"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(error){

      throw new Error(
        error.message
      );

    }

    const retailerNumber=
      currentProfile?.retailer_number||
      "";

    const filtered=
      (data||[]).filter(
        app=>{

          try{

            const details=
              JSON.parse(
                app.remark||"{}"
              );

            return (
              details.retailer_id===
              retailerNumber
            );

          }
          catch{

            return false;

          }

        }
      );


    if(filtered.length===0){

      rows.innerHTML=
        '<tr>'+
        '<td colspan="6" class="empty">'+
        "No applications found."+
        "</td>"+
        "</tr>";

      return;

    }


    rows.innerHTML=
      filtered.map(
        app=>{

          return `
            <tr>

              <td>
                <strong>
                  ${escapeHtml(
                    app.tr_number
                  )}
                </strong>
              </td>

              <td>
                ${escapeHtml(
                  app.service_name
                )}
              </td>

              <td>
                ₹${escapeHtml(
                  app.amount
                )}
              </td>

              <td>
                <span class="badge">
                  ${escapeHtml(
                    app.payment_status||
                    "Pending"
                  )}
                </span>
              </td>

              <td>
                <span class="badge">
                  ${escapeHtml(
                    app.application_status||
                    "Received"
                  )}
                </span>
              </td>

              <td>
                ${formatDate(
                  app.created_at
                )}
              </td>

            </tr>
          `;

        }
      ).join("");

  }
  catch(error){

    console.error(
      "HISTORY ERROR:",
      error
    );

    rows.innerHTML=
      '<tr>'+
      '<td colspan="6" class="empty">'+
      escapeHtml(
        error.message
      )+
      "</td>"+
      "</tr>";

  }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

  if(!value)return "-";

  try{

    return new Date(
      value
    ).toLocaleString(
      "en-IN"
    );

  }
  catch{

    return value;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "AUTH EVENT:",
      event
    );

    if(
      event==="SIGNED_OUT"
    ){

      currentUser=null;
      currentProfile=null;

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

restoreSession();

</script>
