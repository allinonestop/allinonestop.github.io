<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllInOneStop Retailer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:950px;margin:35px auto;padding:18px}.box{background:#fff;border-radius:16px;padding:25px;box-shadow:0 8px 30px #0001;margin-bottom:18px}input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #d0d5dd;border-radius:8px}button,.btn{padding:12px 18px;background:#1769e0;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.logout{background:#475467}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.msg{padding:12px;border-radius:8px;background:#eef5ff;margin-top:12px}.error{background:#fef3f2;color:#b42318}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="box" id="login"><div class="top"><h1>Retailer Login</h1><a class="btn logout" href="index.html">Home</a></div><input id="email" type="text" placeholder="Email / Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><div id="loginMsg"></div></div><div class="box hidden" id="app"><div class="top"><div><h1>New Application</h1><div id="who"></div></div><button class="logout" onclick="logout()">Logout</button></div><div class="grid"><div><label>Name as per Aadhaar (English)</label><input id="nameEn"></div><div><label>આધાર મુજબ નામ (ગુજરાતી)</label><input id="nameGu"></div><div><label>DOB</label><input id="dob" type="date"></div><div><label>Mobile</label><input id="mobile" maxlength="10"></div><div><label>Service</label><select id="service" onchange="price()"><option value="">Select service</option><option value="Ration Card - Name Add|70">Ration Card - Name Add</option><option value="Ration Card - Name Add Without Ration Card|100">Name Add Without Ration Card</option><option value="Ration Card - Name Delete|100">Name Delete</option><option value="Ration Card - Name Delete Without Ration Card|200">Name Delete Without Ration Card</option><option value="Name Correction|350">Name Correction</option><option value="Name Correction Without Ration Card|500">Name Correction Without Ration Card</option><option value="Father Name to Husband Name Update|350">Father Name to Husband Name Update</option><option value="Father Name to Husband Name Update Without Ration Card|500">Father Name to Husband Name Update Without Ration Card</option><option value="PAN Card PDF|70">PAN Card PDF</option><option value="New PAN Card|500">New PAN Card</option><option value="PAN Card Correction|500">PAN Card Correction</option><option value="DL PDF|250">DL PDF</option><option value="RC PDF|300">RC PDF</option><option value="Election Card|500">Election Card</option><option value="Election Card Update|500">Election Card Update</option><option value="Vibhajan|2500">Vibhajan</option><option value="Bandh Card Chalu|3500">Bandh Card Chalu</option><option value="LMS Certificate|1500">LMS Certificate</option></select></div><div><label>Amount</label><input id="amount" readonly></div><div><label>Ration Card PDF</label><input id="ration" type="file" accept=".pdf"></div><div><label>Aadhaar Card PDF</label><input id="aadhaar" type="file" accept=".pdf"></div></div><button onclick="submitApp()">Submit Application</button><div id="msg"></div></div></div><script>const SUPABASE_URL="https://dixsmucrgnyuvudhymdj.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Pdfqt8QfkhprpEtyQJ8jLA_G_-V9D58";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function msg(el,t,e=false){el.innerHTML='<div class="msg '+(e?'error':'')+'">'+esc(t)+'</div>'}async function login(){const v=email.value.trim(),p=pass.value;if(!v||!p){msg(loginMsg,'Email/username and password are required.',true);return}const{data,error}=await supabaseClient.auth.signInWithPassword({email:v,password:p});if(error){msg(loginMsg,error.message,true);return}const{data:profile,error:pe}=await supabaseClient.from('profiles').select('full_name,role,retailer_number').eq('id',data.user.id).maybeSingle();if(pe||!profile||profile.role!=='retailer'){await supabaseClient.auth.signOut();msg(loginMsg,'This account is not a retailer account.',true);return}user=data.user;openApp(profile)}function openApp(profile){login.classList.add('hidden');app.classList.remove('hidden');who.textContent=(profile.full_name||user.email)+(profile.retailer_number?' • '+profile.retailer_number:'')}async function restore(){const{data}=await supabaseClient.auth.getSession();if(!data.session)return;const{data:p}=await supabaseClient.from('profiles').select('full_name,role,retailer_number').eq('id',data.session.user.id).maybeSingle();if(p?.role==='retailer'){user=data.session.user;openApp(p)}}async function logout(){await supabaseClient.auth.signOut();location.reload()}function price(){amount.value=service.value?service.value.split('|')[1]:''}function tr(){const d=new Date();return'AIO-'+d.toISOString().slice(2,10).replaceAll('-','')+'-'+Math.floor(100000+Math.random()*900000)}async function upload(file,path){if(!file)return null;if(file.type!=='application/pdf')throw Error('Only PDF files are allowed.');if(file.size>5*1024*1024)throw Error('PDF must be 5 MB or smaller.');const{error}=await supabaseClient.storage.from('documents').upload(path,file,{upsert:false});if(error)throw error;return path}async function submitApp(){try{if(!user)throw Error('Login required.');if(!nameEn.value.trim()||!mobile.value.trim()||!service.value)throw Error('Fill Name, Mobile and Service.');const s=service.value.split('|'),id=tr();const rpath=await upload(ration.files[0],`${user.id}/${id}-ration.pdf`),apath=await upload(aadhaar.files[0],`${user.id}/${id}-aadhaar.pdf`);const{error}=await supabaseClient.from('applications').insert({tr_number:id,retailer_id:user.id,customer_name_en:nameEn.value.trim(),customer_name_gu:nameGu.value.trim(),dob:dob.value||null,mobile:mobile.value.trim(),service_name:s[0],amount:Number(s[1]),ration_pdf_path:rpath,aadhaar_pdf_path:apath});if(error)throw error;msg(document.getElementById('msg'),'Application submitted successfully. TR Number: '+id)}catch(e){msg(document.getElementById('msg'),e.message||'Application submission failed.',true)}}restore();</script></body></html>
