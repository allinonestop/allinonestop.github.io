<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllInOneStop - Super Retailer 2 Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}.wrap{max-width:700px;margin:40px auto;padding:20px}.card{background:#0f1b2d;border:1px solid #26364f;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 15px 40px #0005}h1{margin-top:0}label{display:block;margin:13px 0 6px;font-weight:700;color:#cbd5e1}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #34445e;background:#091321;color:#fff}button,a{display:inline-block;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#334155;color:#fff}.msg{margin-top:15px;padding:12px;border-radius:10px;white-space:pre-wrap}.ok{background:#06351f;color:#9ef0c5}.err{background:#46151b;color:#fecaca}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#3b1766;color:#e9d5ff;font-weight:800}.hint{color:#94a3b8;font-size:13px;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>👑 Super Retailer 2 Creator</h1><div class="badge">All active services except Ration Card services</div><p class="hint">This separate creator is intentionally isolated from the existing admin UI so the current admin panel is not disturbed.</p><label>Admin Email</label><input id="email" type="email" autocomplete="username"><label>Admin Password</label><input id="adminPass" type="password" autocomplete="current-password"><button class="primary" onclick="adminLogin()">🔐 Admin Login</button><div id="loginMsg"></div></div><div id="panel" class="card" style="display:none"><h2>Create Super Retailer 2</h2><div class="row"><div><label>Retailer Full Name</label><input id="name"></div><div><label>Mobile Number</label><input id="mobile" maxlength="10" inputmode="numeric"></div></div><div class="row"><div><label>Retailer Number (optional)</label><input id="retailerNumber" placeholder="Auto if blank"></div><div><label>Retailer ID / Username (optional)</label><input id="username" placeholder="Auto if blank"></div></div><label>Password</label><input id="password" type="password" placeholder="Minimum 8 characters recommended"><button class="primary" onclick="createRetailer()">➕ Create Super Retailer 2</button><a class="secondary" href="super-retailer-2.html">Open Super Retailer 2 Login</a><a class="secondary" href="admin.html">Back to Main Admin</a><div id="createMsg"></div></div></div><script>const URL='https://dixsmucrgnyuvudhymdj.supabase.co',KEY='sb_publishable_Z5T2Fbbr0RPMZds67p7-9Q_Yw2-jMVn';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);function show(id,text,ok=false){$(id).className='msg '+(ok?'ok':'err');$(id).textContent=text}async function adminLogin(){try{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('adminPass').value});if(error)throw error;if(!data.user)throw new Error('Admin login failed');const{data:p,error:pe}=await sb.from('profiles').select('role,full_name').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!p||p.role!=='admin')throw new Error('Admin access required');$('panel').style.display='block';show('loginMsg','Admin login successful.',true)}catch(e){show('loginMsg',e.message||'Login failed')}}async function createRetailer(){try{const{data:sessionData}=await sb.auth.getSession();if(!sessionData||!sessionData.session)throw new Error('Please login as admin first');const name=$('name').value.trim(),mobile=$('mobile').value.trim(),number=$('retailerNumber').value.trim(),username=$('username').value.trim(),password=$('password').value;if(!name)return show('createMsg','Retailer full name is required.');if(!/^\d{10}$/.test(mobile))return show('createMsg','Mobile number must be exactly 10 digits.');if(password&&password.length<8)return show('createMsg','Password must be at least 8 characters.');const body={action:'create',full_name:name,mobile,retailer_number:number,username,password,retailer_type:'super_pro_2'};const{data,error}=await sb.functions.invoke('admin-create-retailer',{body});if(error)throw new Error(error.message||'Edge Function failed');if(!data||data.error)throw new Error(data?.error||'Could not create retailer');show('createMsg','Super Retailer 2 created successfully.\n\nRetailer ID: '+(data.username||username)+'\nRetailer Number: '+(data.retailer_number||number)+'\n\nOpen the Super Retailer 2 login page to test.',true);$('name').value='';$('mobile').value='';$('retailerNumber').value='';$('username').value='';$('password').value=''}catch(e){show('createMsg',e.message||'Creation failed')}}$('email').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});$('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});</script></body></html>
