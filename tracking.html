ror||error?.message||'TR Number not found.')+'</p>';return}out.innerHTML='<div class="result"><div class="row"><b>TR Number:</b> '+esc(data.tr_number)+'</div><div class="row"><b>Customer:</b> '+esc(data.customer_name_en)+'</div><div class="row"><b>Mobile:</b> '+esc(data.mobile||'—')+'</div><div class="row"><b>Service:</b> '+esc(data.service_name)+'</div><div class="row"><b>Amount:</b> ₹'+esc(data.amount)+'</div><div class="row"><b>Payment:</b> '+esc(data.payment_status)+'</div><div class="row"><b>Status:</b> <span class="status">'+esc(data.application_status)+'</span></div><div class="row"><b>Remark:</b> '+esc(data.remark||'No remark')+'</div></div>'} </script></body></html>
