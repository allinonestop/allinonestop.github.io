<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Track Application - AllInOneStop</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .header {
      background: #0d47a1;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 750px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd4df;
      border-radius: 7px;
      font-size: 16px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .status {
      display: none;
      padding: 13px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    .info {
      display: block;
      background: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #90caf9;
    }

    .result {
      display: none;
    }

    .tr {
      text-align: center;
      background: #e8f5e9;
      border: 2px solid #43a047;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .tr-number {
      font-size: 25px;
      font-weight: bold;
      color: #1b5e20;
      margin-top: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e9ef;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .key {
      font-weight: bold;
      color: #455a64;
    }

    .value {
      text-align: right;
      font-weight: 600;
    }

    .payment {
      padding: 10px;
      border-radius: 6px;
      background: #fff8e1;
    }

    .received {
      color: #1565c0;
    }

    .pending {
      color: #e65100;
    }

    .completed {
      color: #2e7d32;
    }

    .rejected {
      color: #c62828;
    }

    .drive-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      background: #455a64;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

  </style>

</head>

<body>

<div class="header">

  <h1>AllInOneStop</h1>

  <div>
    Application Tracking
  </div>

</div>


<div class="container">

  <div class="card">

    <h2>Track Your Application</h2>

    <div id="status" class="status"></div>

    <label>
      TR Number
    </label>

    <input
      id="trNumber"
      type="text"
      placeholder="TR-20260823-123456-123">

    <button
      id="trackBtn"
      onclick="trackApplication()">
      Track Application
    </button>

  </div>


  <div
    id="result"
    class="card result">

    <div class="tr">

      <div>
        Application TR Number
      </div>

      <div
        class="tr-number"
        id="resultTr">
      </div>

    </div>


    <div class="row">
      <div class="key">Application Status</div>
      <div
        class="value"
        id="applicationStatus">
      </div>
    </div>


    <div class="row">
      <div class="key">Payment Status</div>
      <div
        class="value"
        id="paymentStatus">
      </div>
    </div>


    <div class="row">
      <div class="key">Service</div>
      <div
        class="value"
        id="serviceName">
      </div>
    </div>


    <div class="row">
      <div class="key">Applicant Name</div>
      <div
        class="value"
        id="applicantName">
      </div>
    </div>


    <div class="row">
      <div class="key">Customer Mobile</div>
      <div
        class="value"
        id="customerMobile">
      </div>
    </div>


    <div class="row">
      <div class="key">Amount</div>
      <div
        class="value"
        id="amount">
      </div>
    </div>


    <div class="row">
      <div class="key">UTR Number</div>
      <div
        class="value"
        id="utrNumber">
      </div>
    </div>


    <div class="row">
      <div class="key">Created At</div>
      <div
        class="value"
        id="createdAt">
      </div>
    </div>


    <div id="driveBox" style="display:none; margin-top:20px;">

      <strong>Documents</strong>

      <br>

      <a
        id="driveLink"
        class="drive-link"
        target="_blank">
        Open Documents
      </a>

    </div>

  </div>

</div>


<script>

  /*
   * Replace this with the SAME Apps Script
   * Web App URL used in retailer.html.
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzXjykgcvhRpXlIfFLV4kUY6HyThuHpAXpTWaN3gXN3iCWrCHHkHSgg0Fv9AGKIWsnCRw/exec";


  async function trackApplication() {

    const tr =
      document
        .getElementById("trNumber")
        .value
        .trim();


    if (!tr) {

      showStatus(
        "TR Number required.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "trackBtn"
      );


    button.disabled = true;
    button.textContent =
      "Searching...";


    hideResult();


    try {

      const url =
        API_URL +
        "?action=track&trNumber=" +
        encodeURIComponent(tr);


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (!data.success) {

        showStatus(
          data.message ||
          "Application not found.",
          "error"
        );

        return;

      }


      displayResult(data);


    } catch (error) {

      showStatus(
        "Tracking API error: " +
        error.message,
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Track Application";

    }

  }


  function displayResult(data) {

    document.getElementById(
      "result"
    ).style.display =
      "block";


    document.getElementById(
      "resultTr"
    ).textContent =
      data.trNumber ||
      data.tr_number ||
      data.applicationId ||
      "";


    setText(
      "applicationStatus",
      data.applicationStatus ||
      "Received"
    );


    setText(
      "paymentStatus",
      data.paymentStatus ||
      "Pending"
    );


    setText(
      "serviceName",
      data.serviceName ||
      data.serviceCode ||
      "-"
    );


    setText(
      "applicantName",
      data.applicantName ||
      data.englishName ||
      "-"
    );


    setText(
      "customerMobile",
      data.customerMobile ||
      "-"
    );


    setText(
      "amount",
      data.amount
        ? "₹" + data.amount
        : "-"
    );


    setText(
      "utrNumber",
      data.utrNumber ||
      "-"
    );


    setText(
      "createdAt",
      data.createdAt ||
      "-"
    );


    const drive =
      data.driveFolder;


    if (drive) {

      document.getElementById(
        "driveBox"
      ).style.display =
        "block";


      document.getElementById(
        "driveLink"
      ).href =
        drive;

    }


    showStatus(
      "Application found successfully.",
      "success"
    );

  }


  function setText(id, value) {

    document.getElementById(id)
      .textContent =
      value || "-";

  }


  function hideResult() {

    document.getElementById(
      "result"
    ).style.display =
      "none";

    document.getElementById(
      "driveBox"
    ).style.display =
      "none";

  }


  function showStatus(
    message,
    type
  ) {

    const el =
      document.getElementById(
        "status"
      );

    el.className =
      "status " +
      type;

    el.textContent =
      message;

  }


  document
    .getElementById("trNumber")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          trackApplication();

        }

      }
    );

</script>

</body>
</html>
