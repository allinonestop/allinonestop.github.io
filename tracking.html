<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Track Application - AllInOneStop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .header {
      background: #0d47a1;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 750px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd4df;
      border-radius: 7px;
      font-size: 16px;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #1976d2;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      padding: 13px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    .info {
      display: block;
      background: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #90caf9;
    }

    .result {
      display: none;
    }

    .tr {
      text-align: center;
      background: #e8f5e9;
      border: 2px solid #43a047;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .tr-number {
      font-size: 25px;
      font-weight: bold;
      color: #1b5e20;
      margin-top: 8px;
      word-break: break-word;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e9ef;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .key {
      font-weight: bold;
      color: #455a64;
      min-width: 170px;
    }

    .value {
      text-align: right;
      font-weight: 600;
      word-break: break-word;
    }

    .payment {
      padding: 10px;
      border-radius: 6px;
      background: #fff8e1;
    }

    .received {
      color: #1565c0;
    }

    .pending {
      color: #e65100;
    }

    .completed {
      color: #2e7d32;
    }

    .rejected {
      color: #c62828;
    }

    .drive-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      background: #455a64;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    .drive-link:hover {
      background: #263238;
    }

    .loading {
      text-align: center;
      padding: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      .row {
        display: block;
      }

      .key {
        margin-bottom: 5px;
      }

      .value {
        text-align: left;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="header">
  <h1>AllInOneStop</h1>
  <div>Application Tracking</div>
</div>

<div class="container">

  <div class="card">

    <h2>Track Your Application</h2>

    <div id="status" class="status"></div>

    <label for="trNumber">
      TR Number
    </label>

    <input
      id="trNumber"
      type="text"
      placeholder="TR-20260824-875515"
      autocomplete="off"
    >

    <button
      id="trackBtn"
      type="button"
      onclick="trackApplication()">
      Track Application
    </button>

    <div id="loading" class="loading">
      Searching application...
    </div>

  </div>


  <div id="result" class="card result">

    <div class="tr">

      <div>
        Application TR Number
      </div>

      <div
        class="tr-number"
        id="resultTr">
      </div>

    </div>


    <div class="row">
      <div class="key">Application Status</div>
      <div
        class="value"
        id="applicationStatus">
      </div>
    </div>


    <div class="row">
      <div class="key">Payment Status</div>
      <div
        class="value"
        id="paymentStatus">
      </div>
    </div>


    <div class="row">
      <div class="key">Service</div>
      <div
        class="value"
        id="serviceName">
      </div>
    </div>


    <div class="row">
      <div class="key">Applicant Name</div>
      <div
        class="value"
        id="applicantName">
      </div>
    </div>


    <div class="row">
      <div class="key">Customer Mobile</div>
      <div
        class="value"
        id="customerMobile">
      </div>
    </div>


    <div class="row">
      <div class="key">Amount</div>
      <div
        class="value"
        id="amount">
      </div>
    </div>


    <div class="row">
      <div class="key">UTR Number</div>
      <div
        class="value"
        id="utrNumber">
      </div>
    </div>


    <div class="row">
      <div class="key">Created At</div>
      <div
        class="value"
        id="createdAt">
      </div>
    </div>


    <div
      id="driveBox"
      style="display:none; margin-top:20px;">

      <strong>Documents</strong>

      <br>

      <a
        id="driveLink"
        class="drive-link"
        target="_blank"
        rel="noopener noreferrer">
        Open Documents
      </a>

    </div>

  </div>

</div>


<script>

  /*
   * ==========================================
   * ALLINONESTOP TRACKING
   * ==========================================
   */

  const CONFIG = window.ALLINONESTOP_CONFIG || {};

  const SUPABASE_URL =
    CONFIG.SUPABASE_URL ||
    "https://dixsmucrgnyuvudhymdj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    CONFIG.SUPABASE_PUBLISHABLE_KEY || "";

  const TRACK_FUNCTION =
    "track-application";


  /*
   * ==========================================
   * TRACK APPLICATION
   * ==========================================
   */

  async function trackApplication() {

    const input =
      document.getElementById("trNumber");

    const tr =
      input.value
        .trim()
        .toUpperCase();

    hideResult();
    clearStatus();

    if (!tr) {
      showStatus(
        "Please enter TR Number.",
        "error"
      );
      input.focus();
      return;
    }

    /*
     * Accept only normal TR format
     */
    if (!/^TR-\d{8}-\d{6}$/.test(tr)) {

      showStatus(
        "Invalid TR Number format. Example: TR-20260824-875515",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("trackBtn");

    const loading =
      document.getElementById("loading");


    button.disabled = true;
    button.textContent = "Searching...";

    loading.style.display = "block";


    try {

      /*
       * Public tracking Edge Function
       */

      const url =
        SUPABASE_URL +
        "/functions/v1/" +
        TRACK_FUNCTION +
        "?trNumber=" +
        encodeURIComponent(tr);


      const headers = {
        "Content-Type":
          "application/json"
      };


      /*
       * Send publishable key when available.
       */
      if (SUPABASE_PUBLISHABLE_KEY) {

        headers["apikey"] =
          SUPABASE_PUBLISHABLE_KEY;

        headers["Authorization"] =
          "Bearer " +
          SUPABASE_PUBLISHABLE_KEY;
      }


      const response =
        await fetch(
          url,
          {
            method: "GET",
            headers: headers
          }
        );


      const text =
        await response.text();


      let result = null;


      try {

        result =
          text
            ? JSON.parse(text)
            : null;

      } catch (e) {

        console.error(
          "Tracking response:",
          text
        );

        throw new Error(
          "Invalid response from tracking server."
        );
      }


      console.log(
        "Tracking response:",
        result
      );


      if (
        !response.ok
      ) {

        showStatus(
          result?.message ||
          "Application not found.",
          "error"
        );

        return;
      }


      if (
        !result ||
        result.success !== true
      ) {

        showStatus(
          result?.message ||
          "Application not found.",
          "error"
        );

        return;
      }


      displayResult(result);


    } catch (error) {

      console.error(
        "Tracking error:",
        error
      );

      showStatus(
        error.message ||
        "Unable to connect to tracking server.",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Track Application";

      loading.style.display =
        "none";
    }
  }


  /*
   * ==========================================
   * DISPLAY RESULT
   * ==========================================
   */

  function displayResult(data) {

    const application =
      data.application ||
      data.data ||
      data;


    document.getElementById(
      "result"
    ).style.display = "block";


    setText(
      "resultTr",
      application.trNumber ||
      application.tr_number ||
      data.trNumber ||
      data.tr_number ||
      "-"
    );


    setText(
      "applicationStatus",
      application.applicationStatus ||
      application.application_status ||
      data.applicationStatus ||
      data.application_status ||
      "Received"
    );


    setText(
      "paymentStatus",
      application.paymentStatus ||
      application.payment_status ||
      data.paymentStatus ||
      data.payment_status ||
      "Pending"
    );


    setText(
      "serviceName",
      application.serviceName ||
      application.service_name ||
      data.serviceName ||
      data.service_name ||
      "-"
    );


    setText(
      "applicantName",
      application.applicantName ||
      application.customerNameEn ||
      application.customer_name_en ||
      data.applicantName ||
      data.customerNameEn ||
      data.customer_name_en ||
      "-"
    );


    setText(
      "customerMobile",
      application.customerMobile ||
      application.mobile ||
      data.customerMobile ||
      data.mobile ||
      "-"
    );


    const amount =
      application.amount ??
      data.amount;


    setText(
      "amount",
      amount !== null &&
      amount !== undefined &&
      amount !== ""
        ? "₹" + amount
        : "-"
    );


    setText(
      "utrNumber",
      application.utrNumber ||
      application.utr_number ||
      data.utrNumber ||
      data.utr_number ||
      "-"
    );


    setText(
      "createdAt",
      formatDate(
        application.createdAt ||
        application.created_at ||
        data.createdAt ||
        data.created_at
      )
    );


    /*
     * Drive URL
     */

    const driveUrl =
      application.driveFolderUrl ||
      application.drive_folder_url ||
      data.driveFolderUrl ||
      data.drive_folder_url ||
      application.driveFolder ||
      data.driveFolder ||
      "";


    if (driveUrl) {

      document.getElementById(
        "driveBox"
      ).style.display = "block";

      document.getElementById(
        "driveLink"
      ).href = driveUrl;

    } else {

      document.getElementById(
        "driveBox"
      ).style.display = "none";
    }


    showStatus(
      "Application found successfully.",
      "success"
    );


    /*
     * Scroll result into view
     */

    document.getElementById(
      "result"
    ).scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }


  /*
   * ==========================================
   * HELPERS
   * ==========================================
   */

  function setText(
    id,
    value
  ) {

    const element =
      document.getElementById(id);

    if (!element) return;

    element.textContent =
      value === null ||
      value === undefined ||
      value === ""
        ? "-"
        : String(value);
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    try {

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return date.toLocaleString(
        "en-IN",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    } catch (e) {

      return String(value);
    }
  }


  function hideResult() {

    document.getElementById(
      "result"
    ).style.display = "none";

    document.getElementById(
      "driveBox"
    ).style.display = "none";
  }


  function clearStatus() {

    const element =
      document.getElementById(
        "status"
      );

    element.className =
      "status";

    element.textContent =
      "";

    element.style.display =
      "none";
  }


  function showStatus(
    message,
    type
  ) {

    const element =
      document.getElementById(
        "status"
      );

    element.className =
      "status " + type;

    element.textContent =
      message;

    element.style.display =
      "block";
  }


  /*
   * ENTER KEY
   */

  document
    .getElementById("trNumber")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          trackApplication();
        }
      }
    );


  /*
   * AUTO READ TR NUMBER FROM URL
   *
   * Example:
   * tracking.html?tr=TR-20260824-875515
   */

  window.addEventListener(
    "DOMContentLoaded",
    function() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const tr =
        params.get("tr") ||
        params.get("trNumber");

      if (tr) {

        document.getElementById(
          "trNumber"
        ).value =
          tr
            .trim()
            .toUpperCase();

        trackApplication();
      }
    }
  );

</script>

</body>
</html>
