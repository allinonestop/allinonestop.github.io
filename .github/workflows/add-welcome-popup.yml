name: Add Rajkumar Welcome Popup

on:
  push:
    paths:
      - '.github/trigger-welcome-popup'
      - '.github/trigger-welcome-popup-2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add welcome popup safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="rajkumarWelcome"' in s:
              print('Welcome popup already present; nothing to change.')
              raise SystemExit(0)

          css = r'''
/* RAJKUMAR WELCOME POPUP */
#rajkumarWelcome {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(12, 18, 38, .62);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}
#rajkumarWelcome .welcome-card {
  width: min(430px, 94vw);
  padding: 38px 28px 30px;
  text-align: center;
  border-radius: 26px;
  background: #fff;
  box-shadow: 0 25px 80px rgba(0,0,0,.28);
  animation: rajWelcomeIn .35s ease-out;
}
#rajkumarWelcome h2 {
  margin: 0;
  color: #18233f;
  font-size: clamp(27px, 7vw, 38px);
  line-height: 1.1;
  font-weight: 900;
}
#rajkumarWelcome p {
  margin: 12px 0 25px;
  color: #64718b;
  font-size: 16px;
  font-weight: 700;
}
#rajkumarWelcome button {
  border: 0;
  min-width: 130px;
  padding: 13px 28px;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(135deg, #635bff, #287cff);
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(67,88,255,.25);
}
#rajkumarWelcome button:hover { transform: translateY(-2px); }
@keyframes rajWelcomeIn {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
'''

          popup = r'''
<!-- RAJKUMAR WELCOME POPUP -->
<div id="rajkumarWelcome" role="dialog" aria-modal="true" aria-label="Welcome">
  <div class="welcome-card">
    <h2>Welcome to Rajkumar</h2>
    <p>Fast &amp; Trusted Website</p>
    <button type="button" onclick="closeRajkumarWelcome()">OK</button>
  </div>
</div>
'''

          script = r'''
<script>
function closeRajkumarWelcome(){
  const popup = document.getElementById('rajkumarWelcome');
  if (popup) popup.remove();
}
</script>
'''

          if not re.search(r'</head\s*>', s, re.I):
              raise SystemExit('ERROR: </head> not found; index.html was not changed.')
          body_match = re.search(r'<body\b[^>]*>', s, re.I)
          if not body_match:
              raise SystemExit('ERROR: <body> not found; index.html was not changed.')
          if not re.search(r'</body\s*>', s, re.I):
              raise SystemExit('ERROR: </body> not found; index.html was not changed.')

          s = re.sub(r'</head\s*>', css + '\n</head>', s, count=1, flags=re.I)
          s = s[:body_match.end()] + '\n' + popup + s[body_match.end():]
          s = re.sub(r'</body\s*>', script + '\n</body>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          print('Welcome popup added successfully without replacing existing homepage code.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add safe Rajkumar welcome popup"
          git push
