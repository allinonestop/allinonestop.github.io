name: Fix Super Retailer 2 Services
on:
  push:
    paths:
      - '.github/super-retailer-2-services-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch service filter
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('super-retailer-2.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r"function isRationCardService\(service\)\{.*?\nfunction effectiveServiceAmount", s, re.S)
          if not old:
              raise SystemExit('Target service filter block not found')
          new='''const SUPER_RETAILER_2_NON_RATION_IDS = new Set([\
          "e36db3f8-901a-4ad1-a3b3-ad0824c67eea",\
          "2512cc66-55b1-4902-94f2-aed37455005e",\
          "c7d01138-0297-4939-8f51-14d6bc198467",\
          "d507995a-0e6b-4452-88d7-62fcfda6a7aa",\
          "a1af6939-4551-4293-b6c0-df89ce3ddd0b",\
          "be81bdb0-750a-4f31-bb61-2f56c164c8d7",\
          "945ed088-a4b2-4cf2-8a98-6af159500b38",\
          "08be2246-a0c1-41a5-8109-04d2c4362289",\
          "5c4e4b06-d76b-4a48-8f4d-5461f86f35c5",\
          "0158f80d-600e-4988-95c4-74f2cf8f0960",\
          "b35b527d-f79c-4e65-b5cb-b752ae5cd280",\
          "6fe4970a-1d4e-4447-90e6-0d2e6955de45",\
          "10d3ccb3-dd53-4110-a70f-3050c159e7c2",\
          "4f1b6dfa-11a1-4253-a35e-84687a4edbd1",\
          "81cbaee3-d4fe-4129-95ad-125761c255af",\
          "285623c7-ccc7-494f-b0be-6c1aad68581f",\
          "37c50626-5e4a-413a-bd1d-133a47600a3b",\
          "50d92372-5efa-4c83-831c-f2c909168efe",\
          "2c44c7e9-ebf1-4bbd-9449-7086cbe7d078",\
          "296736a1-110c-4013-be09-455d303c4aac",\
          "bb6834de-a33e-4712-98ec-85a3010e9810",\
          "bd4461e6-5f6b-4f93-8c8f-3514b0483e3a",\
          "dcd4084c-7898-44ea-a09a-79a4711bc782"\
          ]);
function isRationCardService(service){
  return !SUPER_RETAILER_2_NON_RATION_IDS.has(String(service?.id||''));
}
function effectiveServiceAmount'''
          s=s[:old.start()]+new+s[old.end()-len('function effectiveServiceAmount'):]
          s=s.replace('services=(data||[]).filter(s=>!isRationCardService(s));','services=(data||[]).filter(s=>SUPER_RETAILER_2_NON_RATION_IDS.has(String(s?.id||"")));',1)
          s=s.replace('$("serviceAccessNote").textContent="Super Retailer 2 • Ration Card services are hidden • Normal retailer pricing applies";','$("serviceAccessNote").textContent="👑 Super Retailer 2 • Ration Card services are hidden • Normal retailer pricing applies";',1)
          p.write_text(s,encoding='utf-8')
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/sr2.js').write_text(js,encoding='utf-8')
          print('JS bytes:',len(js))
          PY
          node --check /tmp/sr2.js
          grep -q 'SUPER_RETAILER_2_NON_RATION_IDS' super-retailer-2.html
          grep -q 'services=(data||\[\]).filter(s=>SUPER_RETAILER_2_NON_RATION_IDS.has' super-retailer-2.html
          echo 'Super Retailer 2 service filter validation passed.'
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add super-retailer-2.html
          git commit -m 'Fix Super Retailer 2 to show only non-ration services'
          git push