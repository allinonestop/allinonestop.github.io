name: Fix Admin Panel Visibility

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix admin panel visibility gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ADMIN PANEL VISIBILITY GUARD */'
          if marker not in s:
              patch = r'''<script>
          /* ADMIN PANEL VISIBILITY GUARD */
          (function(){
            function syncAdminVisibility(){
              const loginBox=document.getElementById('loginBox');
              const panel=document.getElementById('adminPanel');
              if(!loginBox || !panel) return;
              const authenticated=loginBox.classList.contains('hidden');
              panel.classList.toggle('hidden',!authenticated);
              if(authenticated) panel.removeAttribute('data-logged-out');
              else panel.setAttribute('data-logged-out','1');
            }
            function start(){
              const loginBox=document.getElementById('loginBox');
              const panel=document.getElementById('adminPanel');
              if(!loginBox || !panel) return;
              syncAdminVisibility();
              new MutationObserver(syncAdminVisibility).observe(loginBox,{attributes:true,attributeFilter:['class']});
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
            else start();
          })();
          </script>
          '''
              s = s.replace('</body>', patch + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Fix retailer Home redirect
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('retailer.html')
          s = p.read_text(encoding='utf-8')
          original = s
          s = re.sub(r'function\s+goHome\s*\(\)\s*\{.*?\}', 'function goHome(){\n\n  window.location.replace("https://allinonestop.github.io/");\n\n}', s, count=1, flags=re.S)
          replacements = [
              ('href="index.html"', 'href="https://allinonestop.github.io/"'),
              ("href='index.html'", "href='https://allinonestop.github.io/'"),
              ('href="./index.html"', 'href="https://allinonestop.github.io/"'),
              ("href='./index.html'", "href='https://allinonestop.github.io/'"),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          if s == original:
              raise SystemExit('No retailer Home redirect pattern found; refusing to change the file.')
          p.write_text(s, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html retailer.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix retailer Home redirect"
            git push
          fi
