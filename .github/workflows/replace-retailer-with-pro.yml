name: Replace Retailer with Retailer Pro
on:
  push:
    paths:
      - '.github/retailer-pro-replace-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace retailer portal logic
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('retailer.html')
          s=p.read_text(encoding='utf-8')
          # Change branding only; keep the existing page structure.
          s=s.replace('<title>AllInOneStop - Retailer Portal</title>','<title>AllInOneStop - Retailer Pro</title>',1)
          # Remove an older Retailer Pro patch block if this workflow is ever re-run.
          s=re.sub(r'\n<script id="retailer-pro-runtime">.*?</script>\n', '\n', s, flags=re.S)
          js=r'''<script id="retailer-pro-runtime">
(function(){
  const PRO_TYPES=['super_pro_2','retailer_pro','super_retailer_2','super_retailer_2_pro'];
  function norm(v){return String(v||'').toLowerCase().trim().replace(/[\s-]+/g,'_')}
  function isPro(p){return PRO_TYPES.includes(norm(p?.retailer_type||p?.service_access||''))}
  function ids(v){let s=String(v||'').trim().toUpperCase();if(!s)return[];return[...new Set([s,s.startsWith('RET-')?s.slice(4):'RET-'+s])];}
  function emails(v){return ids(v).map(x=>x.toLowerCase()+'@dixsmucrgnyuvudhymdj.supabase.co')}
  function rationName(n){n=norm(n).replace(/_/g,' ');return /(ration|redtion|nsfa|vibhajan|division|wrong finger|finger correction|fingerprint|name add|name delete|delete name|pita name to pati name|ration number to aadhar)/i.test(n)}
  function allowedService(s){
    const n=String(s?.name||'').toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
    if(rationName(n))return false;
    return /lms/i.test(n) || /(^|\s)dl(\s|$)/i.test(n) || /dl pdf|driving licen[cs]e/i.test(n) || /(^|\s)rc(\s|$)/i.test(n) || /rc pdf|registration certificate/i.test(n) || /election|voter|chutni/i.test(n) || /pdf|download/i.test(n);
  }
  function escape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
  function filterServices(){
    try{
      if(typeof services==='undefined'||!Array.isArray(services))return;
      services=services.filter(allowedService);
      if(typeof renderServiceFolders==='function')renderServiceFolders();
      const sel=document.getElementById('service');
      if(sel){const current=sel.value;sel.innerHTML='<option value="">Select Service</option>';services.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name+' - ₹'+Number(x.amount||0);sel.appendChild(o)});if(current&&services.some(x=>String(x.id)===String(current)))sel.value=current;}
      const n=document.getElementById('serviceAccessNote');if(n)n.textContent='👑 Retailer Pro • Only DL, RC, Voter Card, LMS and PDF/Download work • Ration Card services blocked';
    }catch(e){console.warn('Retailer Pro service filter:',e)}
  }
  function patchBrand(){
    const h=document.querySelector('h1');if(h&&/Retailer Portal/i.test(h.textContent))h.textContent='👑 AllInOneStop - Retailer Pro';
    document.title='AllInOneStop - Retailer Pro';
  }
  async function proLogin(){
    if(typeof clearMessage==='function')clearMessage('loginMessage');
    const u=(document.getElementById('username')?.value||document.getElementById('retailerUsername')?.value||'').trim();
    const p=document.getElementById('password')?.value||'';
    const message=document.getElementById('loginMessage');
    if(!u||!p){if(message)message.innerHTML='<div class="status error">Retailer ID and Password are required.</div>';return}
    const btn=document.querySelector('#loginBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Logging in...'}
    let last='Invalid login credentials';
    try{
      for(const em of emails(u)){
        const {data,error}=await supabaseClient.auth.signInWithPassword({email:em,password:p});
        if(error){last=error.message;continue;}
        const {data:pr,error:pe}=await supabaseClient.from('profiles').select('*').eq('id',data.user.id).maybeSingle();
        if(pe)throw pe;if(!pr||pr.role!=='retailer')throw new Error('Retailer profile not found.');
        if(!isPro(pr)){await supabaseClient.auth.signOut();throw new Error('This account does not have Retailer Pro access. Admin me Super Retailer 2 select karke account create karein.')}
        retailer=pr;
        if(typeof showApp==='function')showApp();
        if(typeof loadServices==='function')await loadServices();
        if(typeof loadApplicationHistory==='function')await loadApplicationHistory();
        else if(typeof loadHistory==='function')await loadHistory();
        filterServices();patchBrand();return;
      }
      throw new Error(last);
    }catch(e){console.error('Retailer Pro login',e);if(message)message.innerHTML='<div class="status error">'+escape(e.message||'Login failed.')+'</div>'}
    finally{if(btn){btn.disabled=false;btn.textContent='Login'}}
  }
  function fileKey(input,i){
    const parent=input.closest('.file,.document,.uploadBox,div')||input.parentElement;
    const label=parent?.querySelector('label')?.textContent?.toLowerCase()||'';
    const id=String(input.id||input.name||'').toLowerCase();
    const src=label+' '+id;
    if(src.includes('payment'))return'payment_screenshot';
    if(src.includes('mother'))return'mother_election_card_pdf';
    if(src.includes('father'))return'father_election_card_pdf';
    if(src.includes('election card')||src.includes('voter'))return'election_card_pdf';
    if(src.includes('signature'))return'customer_signature';
    if(src.includes('aadhaar')||src.includes('aadhar'))return'aadhaar_pdf';
    if(src.includes('lc ' )||src.includes('lc pdf'))return'lc_pdf';
    if(src.includes('photo'))return'customer_photo';
    return 'document_'+i;
  }
  function readFile(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type||'application/octet-stream',data:r.result});r.onerror=reject;r.readAsDataURL(f)})}
  async function collectFiles(){const out={};let i=0;for(const input of document.querySelectorAll('input[type="file"]')){const f=input.files?.[0];if(f){out[fileKey(input,i++)]=await readFile(f)}}return out}
  function collectFields(){const out={};document.querySelectorAll('[data-field]').forEach(e=>{if(e.value!=null)out[e.dataset.field]=e.value.trim()});if(!Object.keys(out).length){document.querySelectorAll('#dynamicFields input,#dynamicFields select,#dynamicFields textarea').forEach((e,i)=>{if(e.value)out[e.name||e.id||('field_'+i)]=e.value.trim()})}return out}
  async function proSubmit(){
    try{
      if(typeof selected==='undefined'||!selected)return alert('Please select a service.');
      const utr=(document.getElementById('utr')?.value||document.getElementById('utrNumber')?.value||'').trim();if(!utr)return alert('UTR / Transaction Number is required.');
      const files=await collectFiles();if(!files.payment_screenshot)return alert('Payment Screenshot is required.');
      const fields=collectFields();const {data:auth,error:ae}=await supabaseClient.auth.getUser();if(ae||!auth?.user)return alert('Login session expired. Please login again.');
      const amount=Number(typeof effectiveServiceAmount==='function'?effectiveServiceAmount(selected):selected.amount||0);
      const payload={retailer_id:auth.user.id,service_name:selected.name,amount,payment_status:'Pending',application_status:'Pending',utr_number:utr,fields,files};
      const {data,error}=await supabaseClient.functions.invoke('submit-application',{body:payload});
      if(error)throw new Error(await readFnError(error));if(!data?.success)throw new Error(data?.message||'Application submission failed.');
      const tr=data.trNumber||data.tr_number||'-';
      const trEl=document.getElementById('tr')||document.getElementById('trNumber')||document.querySelector('.trno');if(trEl)trEl.textContent=tr;
      const box=document.getElementById('trBox')||document.querySelector('.tr');if(box)box.style.display='block';
      if(typeof showMessage==='function')showMessage('Application submitted successfully. TR: '+tr,false);
      else if(typeof msg==='function')msg('Application submitted successfully. TR: '+tr,'ok');
      if(typeof loadApplicationHistory==='function')await loadApplicationHistory();
      return tr;
    }catch(e){console.error('Retailer Pro submit',e);if(typeof showMessage==='function')showMessage(e.message||'Application submission failed.',true);else alert(e.message||'Application submission failed.');return null}
  }
  async function readFnError(e){try{const r=e?.context;if(r&&typeof r.clone==='function'){const c=r.clone(),ct=c.headers?.get('content-type')||'';if(ct.includes('application/json')){const j=await c.json();return j.message||j.error||e.message}const t=await c.text();if(t)return t}}catch{}return e?.message||'Edge Function request failed.'}
  function patchGlobals(){
    try{
      if(typeof loadServices==='function'&&!loadServices.__retailerPro){const original=loadServices;const wrapped=async function(){const r=await original();filterServices();return r};wrapped.__retailerPro=true;loadServices=wrapped;}
      if(typeof effectiveServiceAmount==='function')effectiveServiceAmount=function(s){return Number(s?.amount||0)};
      window.login=proLogin;window.submitApplication=proSubmit;window.__retailerProFilter=filterServices;
    }catch(e){console.warn('Retailer Pro globals',e)}
  }
  function start(){patchBrand();patchGlobals();filterServices();setInterval(()=>{patchBrand();patchGlobals();filterServices()},1000)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          js_all='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/retailer-pro-check.js').write_text(js_all,encoding='utf-8')
          PY
          node --check /tmp/retailer-pro-check.js
          grep -q 'Retailer Pro' retailer.html
          grep -q 'Only DL, RC, Voter Card, LMS' retailer.html
          echo 'Retailer Pro patch validation passed.'
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retailer.html
          git commit -m 'Replace retailer portal with Retailer Pro'
          git push
