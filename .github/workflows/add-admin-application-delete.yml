name: Add Admin Application Delete
on:
  push:
    paths:
      - '.github/admin-application-delete-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin.html
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          script = r'''
<script>
/* Admin application delete helper: added without changing existing application logic. */
(function(){
  async function deleteAdminApplication(tr){
    tr=String(tr||'').trim();
    if(!tr){alert('TR Number not found.');return;}
    const c=prompt('Delete application '+tr+'?\\n\\nType DELETE to confirm.');
    if(c!=='DELETE') return;
    try{
      if(typeof getSession==='function') await getSession();
      if(!window.supabaseClient || !window.supabaseClient.from){throw new Error('Supabase client not available.');}
      const {error}=await window.supabaseClient.from('applications').delete().eq('tr_number',tr);
      if(error) throw error;
      alert('Application deleted successfully.');
      if(typeof refreshDashboard==='function') await refreshDashboard();
    }catch(e){
      console.error('DELETE APPLICATION ERROR',e);
      alert(e?.message || 'Application deletion failed.');
    }
  }
  window.deleteAdminApplication=deleteAdminApplication;

  function addDeleteButtons(){
    const tbody=document.getElementById('applicationRows');
    if(!tbody) return;
    Array.from(tbody.querySelectorAll('tr')).forEach(function(row){
      if(row.dataset.adminDeleteAdded==='1') return;
      const cells=row.children;
      if(!cells || cells.length<7) return;
      const tr=(cells[0].textContent||'').trim();
      if(!tr || !/^TR[-\\w]+$/i.test(tr)) return;
      const actionCell=cells[cells.length-1];
      if(!actionCell) return;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='small-btn delete-btn';
      btn.textContent='🗑️ Delete';
      btn.style.marginLeft='6px';
      btn.addEventListener('click',function(){deleteAdminApplication(tr);});
      actionCell.appendChild(btn);
      row.dataset.adminDeleteAdded='1';
    });
  }

  document.addEventListener('DOMContentLoaded',function(){
    addDeleteButtons();
    const tbody=document.getElementById('applicationRows');
    if(tbody){
      new MutationObserver(addDeleteButtons).observe(tbody,{childList:true,subtree:true});
    }
  });
})();
</script>
'''
          if 'deleteAdminApplication' not in s:
              idx=s.lower().rfind('</body>')
              if idx < 0: raise SystemExit('BODY closing tag not found')
              s=s[:idx]+script+'\n'+s[idx:]
              p.write_text(s,encoding='utf-8')
          print('Patched admin.html')
          PY

          echo 'Checking HTML/JS syntax...'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('admin.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/admin-check.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Scripts:',len(scripts))
          PY
          node --check /tmp/admin-check.js
          grep -q 'deleteAdminApplication' admin.html
          grep -q 'Application deleted successfully' admin.html
          echo 'Validation passed.'

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add admin application delete action'
          git push