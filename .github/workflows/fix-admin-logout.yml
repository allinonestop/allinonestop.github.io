name: Fix admin logout redirect

on:
  push:
    paths:
      - '.github/workflows/fix-admin-logout.yml'

permissions:
  contents: write

jobs:
  fix-admin-logout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix logout redirects
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          old1 = '''  window.location.href =\n    "admin.html";'''
          new1 = '''  window.location.replace("https://allinonestop.github.io/");'''

          old2 = '''      window.location.href =\n        "admin.html";'''
          new2 = '''      window.location.replace("https://allinonestop.github.io/");'''

          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('No matching logout redirects found; nothing to change.')

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Fix admin logout redirect"
          git push
