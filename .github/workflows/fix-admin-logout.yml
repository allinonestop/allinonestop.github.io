name: Fix admin logout
on:
  push:
    paths:
      - '.github/trigger-admin-logout'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin logout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old=s
          pattern=r'await supabaseClient\.auth\.signOut\(\);'
          replacement='''await Promise.race([\n      supabaseClient.auth.signOut(),\n      new Promise(resolve => setTimeout(resolve, 1000))\n    ]);\n\n    window.location.replace("https://allinonestop.github.io/");'''
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
              raise SystemExit('ADMIN_LOGOUT_PATCH_FAILED: signOut line not found')
          p.write_text(s,encoding='utf-8')
          print('PATCH_OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Fix admin logout navigation'
          git push
