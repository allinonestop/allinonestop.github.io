name: Fix Auth Routing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch auth code
        shell: python
        run: |
          from pathlib import Path
          import re

          retailer = Path('retailer.html')
          text = retailer.read_text(encoding='utf-8')

          pattern = re.compile(
              r'async function login\(\)\{.*?\}\n\n\n/\* =====================================================\n   RETAILER PROFILE\n',
              re.S,
          )

          replacement = r'''async function login(){const username=$("username").value.trim().toUpperCase(),password=$("password").value;if(!username||!password){loginMsg("Retailer ID and Password required.");return;}$("loginBtn").disabled=true;try{await sb.auth.signOut();const{data,error}=await sb.functions.invoke("retailer-login",{body:{retailer_id:username,password:password}});if(error)throw new Error(data?.error||error.message||"Login failed.");if(!data?.session?.access_token||!data?.session?.refresh_token)throw new Error(data?.error||"Login failed.");const{error:sessionError}=await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(sessionError)throw sessionError;const{data:pr,error:pe}=await sb.from("profiles").select("*").eq("id",data.session.user.id).maybeSingle();if(pe)throw pe;if(!pr||pr.role!=="retailer")throw new Error("Retailer profile not found.");if(!modeTypeMatches(selectedLoginMode,pr)){await sb.auth.signOut();const wanted=selectedLoginMode==="retailer"?"Retailer":selectedLoginMode==="super"?"Super Retailer":"Retailer Pro";throw new Error("Selected mode "+wanted+" does not match this account. Please select the correct mode.");}retailer=pr;showApp();await loadServices();await loadApplicationHistory();}catch(e){console.error("Login error:",e);loginMsg(e.message||"Login failed.");}finally{$("loginBtn").disabled=false;}}


/* =====================================================
   RETAILER PROFILE
'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('retailer.html login block not found; no changes made')

          new_text = new_text.replace(
              '<script src="config.js"></script>',
              '<script src="config.js?v=20260915login"></script>',
              1,
          )
          retailer.write_text(new_text, encoding='utf-8')

          admin = Path('admin.html')
          atext = admin.read_text(encoding='utf-8')
          old = '''window.location.href =
    "admin.html";'''
          new = '''window.location.replace("/index.html");'''
          if old not in atext:
              raise SystemExit('admin logout redirect not found; no changes made')
          atext = atext.replace(old, new, 1)
          admin.write_text(atext, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailer.html admin.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix retailer ID login and admin logout"
          git push
