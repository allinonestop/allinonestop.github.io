name: Patch Super Retailer 2 Admin

on:
  push:
    paths:
      - 'admin.html'
      - '.github/workflows/patch-super-retailer-2-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          if 'id="retailerTypeSuper2"' not in s:
              old = '''            <div class="type-option">\n              <input type="radio" id="retailerTypeSuper" name="retailerType" value="super_pro">\n              <label for="retailerTypeSuper"><strong>👑 Super Retailer Pro</strong><span>All services + private account prices.</span></label>\n            </div>'''
              new = old + '''\n            <div class="type-option">\n              <input type="radio" id="retailerTypeSuper2" name="retailerType" value="super_pro_2">\n              <label for="retailerTypeSuper2"><strong>👑 Super Retailer 2</strong><span>All services except Ration Card services.</span></label>\n            </div>'''
              if old not in s:
                  raise SystemExit('Super Retailer Pro block not found')
              s = s.replace(old, new, 1)

          old_opts = '''    ["ration_card","🍚 Ration Card Only"],\n    ["all_work","🌐 All Work"],\n    ["super_pro","👑 Super Retailer Pro"]'''
          new_opts = '''    ["ration_card","🍚 Ration Card Only"],\n    ["all_work","🌐 All Work"],\n    ["super_pro","👑 Super Retailer Pro"],\n    ["super_pro_2","👑 Super Retailer 2"]'''
          if old_opts in s:
              s = s.replace(old_opts, new_opts, 1)

          old_badge = '''retailer.retailer_type === "all_work" ? "all" : retailer.retailer_type === "super_pro" ? "super" : ""'''
          new_badge = '''retailer.retailer_type === "all_work" ? "all" : retailer.retailer_type === "super_pro" ? "super" : retailer.retailer_type === "super_pro_2" ? "super2" : ""'''
          s = s.replace(old_badge, new_badge, 1)

          old_text = '''retailer.retailer_type === "all_work" ? "🌐 All Work" : retailer.retailer_type === "super_pro" ? "👑 Super Retailer Pro" : "🍚 Ration Card Only"'''
          new_text = '''retailer.retailer_type === "all_work" ? "🌐 All Work" : retailer.retailer_type === "super_pro" ? "👑 Super Retailer Pro" : retailer.retailer_type === "super_pro_2" ? "👑 Super Retailer 2" : "🍚 Ration Card Only"'''
          s = s.replace(old_text, new_text, 1)

          marker = '.type-badge.super{background:#f3e8ff;color:#6d28d9;border:1px solid #d8b4fe}'
          if '.type-badge.super2{' not in s and marker in s:
              s = s.replace(marker, marker + '.type-badge.super2{background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc}', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched admin.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add Super Retailer 2 to main admin access'
          git push
