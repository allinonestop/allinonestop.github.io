name: Set Distinct Retailer IDs
on:
  push:
    paths:
      - '.github/distinct-retailer-id-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch admin ID generation and retailer login placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          old='''function generateRetailerId() {\n\n  const username =\n    "RET-" + randomRetailerCode();'''
          new='''function getSelectedRetailerTypeForId() {\n  const el = document.querySelector('input[name="retailerType"]:checked');\n  return el ? el.value : "all_work";\n}\n\nfunction retailerIdPrefixForType(type) {\n  if (type === "super_pro") return "SUP-";\n  if (type === "super_pro_2") return "PRO-";\n  return "RET-";\n}\n\nfunction generateRetailerId() {\n\n  const prefix = retailerIdPrefixForType(getSelectedRetailerTypeForId());\n  const username =\n    prefix + randomRetailerCode();'''
          if old not in s:
              raise SystemExit('generateRetailerId marker not found')
          s=s.replace(old,new,1)

          # Auto-change the generated login ID when account type changes.
          marker='''function generateRetailerId() {'''
          hook='''document.querySelectorAll('input[name="retailerType"]').forEach(el=>{\n  el.addEventListener("change",()=>generateRetailerId());\n});\n\n'''
          if 'el.addEventListener("change",()=>generateRetailerId())' not in s:
              pos=s.find(marker)
              if pos<0: raise SystemExit('generate function not found for hook')
              s=s[:pos]+hook+s[pos:]

          # Make the hint explicit without changing other create flow.
          s=s.replace('''<div class="hint">\n          यही Retailer ID login के लिए use होगी।\n        </div>''','''<div class="hint">\n          Retailer → RET-XXXXXX | Super Retailer → SUP-XXXXXX | Retailer Pro → PRO-XXXXXX. यही ID login के लिए use होगी।\n        </div>''',1)

          p.write_text(s,encoding='utf-8')
          # Lightweight validation.
          assert 'prefix + randomRetailerCode()' in s
          assert 'value="all_work"' in s and 'value="super_pro"' in s and 'value="super_pro_2"' in s
          assert 'SUP-' in s and 'PRO-' in s
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Use distinct IDs for Retailer Super Retailer and Retailer Pro'
          git push
