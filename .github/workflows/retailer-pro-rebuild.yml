name: Retailer Pro Rebuild
on:
  push:
    paths:
      - '.github/retailer-pro-rebuild-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild retailer.html from Super Retailer 2 base
        shell: bash
        run: |
          set -e
          cp super-retailer-2.html retailer.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('retailer.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>AllInOneStop - Super Retailer 2 Portal</title>','<title>AllInOneStop - Retailer Pro</title>',1)
          patch=r'''<script id="retailer-pro-final-patch">
          (function(){
            const PRO_TYPES=['super_pro_2','retailer_pro','super_retailer_2','super_retailer_2_pro'];
            const norm=v=>String(v||'').toLowerCase().trim().replace(/[\s-]+/g,'_');
            const isPro=p=>PRO_TYPES.includes(norm(p?.retailer_type||p?.service_access||''));
            const variants=v=>{let s=String(v||'').trim().toUpperCase();if(!s)return[];return[...new Set([s,s.startsWith('RET-')?s.slice(4):'RET-'+s])];};
            const authEmails=v=>variants(v).map(x=>x.toLowerCase()+'@dixsmucrgnyuvudhymdj.supabase.co');
            function allow(s){const n=String(s?.name||'').toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();if(/ration|redtion|nsfa|vibhajan|division|finger correction|wrong finger|fingerprint|name add|name delete|delete name|pita name to pati name|ration number to aadhar/.test(n))return false;return /lms|(^|\s)dl(\s|$)|dl pdf|driving licen[cs]e|(^|\s)rc(\s|$)|rc pdf|registration certificate|election|voter|chutni|pdf|download/.test(n);}
            function filter(){try{if(typeof services==='undefined'||!Array.isArray(services))return;services=services.filter(allow);if(typeof renderServiceFolders==='function')renderServiceFolders();const sel=document.getElementById('service');if(sel){const cur=sel.value;sel.innerHTML='<option value="">Select Service</option>';services.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name+' - ₹'+Number(x.amount||0);sel.appendChild(o)});if(cur&&services.some(x=>String(x.id)===String(cur)))sel.value=cur;}}catch(e){console.warn(e)}}
            function patchLoad(){if(typeof loadServices==='function'&&!loadServices.__rp){const old=loadServices;const wrap=async function(){const r=await old();filter();return r};wrap.__rp=true;loadServices=wrap;}}
            async function loginPro(){const u=(document.getElementById('username')?.value||'').trim(),p=document.getElementById('password')?.value||'',err=document.getElementById('loginMsg');if(!u||!p){if(err)err.textContent='Retailer ID and Password required.';return;}const b=document.getElementById('loginBtn');if(b){b.disabled=true;b.textContent='Logging in...'}let last='Invalid login credentials';try{for(const email of authEmails(u)){const r=await supabaseClient.auth.signInWithPassword({email,password:p});if(r.error){last=r.error.message;continue;}const q=await supabaseClient.from('profiles').select('*').eq('id',r.data.user.id).maybeSingle();if(q.error)throw q.error;if(!q.data||q.data.role!=='retailer')throw new Error('Retailer profile not found.');if(!isPro(q.data)){await supabaseClient.auth.signOut();throw new Error('This account does not have Retailer Pro access. Admin me Super Retailer 2 select karein.');}retailer=q.data;if(typeof showApp==='function')showApp();patchLoad();await loadServices();if(typeof loadApplicationHistory==='function')await loadApplicationHistory();else if(typeof loadHistory==='function')await loadHistory();filter();return;}throw new Error(last);}catch(e){if(err)err.textContent=e.message||'Login failed.';}finally{if(b){b.disabled=false;b.textContent='Login'}}}
            function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name,type:f.type||'application/octet-stream',data:r.result});r.onerror=rej;r.readAsDataURL(f)})}
            function fkey(input,i){const p=input.closest('div');const label=(p?.querySelector('label')?.textContent||'').toLowerCase();const src=label+' '+String(input.id||'').toLowerCase();if(src.includes('payment'))return'payment_screenshot';if(src.includes('mother'))return'mother_election_card_pdf';if(src.includes('father'))return'father_election_card_pdf';if(src.includes('signature'))return'customer_signature';if(src.includes('aadhaar')||src.includes('aadhar'))return'aadhaar_pdf';if(src.includes('lc'))return'lc_pdf';if(src.includes('photo'))return'customer_photo';if(src.includes('election')||src.includes('voter'))return'election_card_pdf';return'document_'+i;}
            async function submitPro(){try{if(typeof selected==='undefined'||!selected)return alert('Please select a service.');const utr=(document.getElementById('utr')?.value||document.getElementById('utrNumber')?.value||'').trim();if(!utr)return alert('UTR / Transaction Number is required.');const files={};let i=0;for(const input of document.querySelectorAll('input[type=file]')){if(input.files?.[0])files[fkey(input,i++)]=await readFile(input.files[0]);}if(!files.payment_screenshot)return alert('Payment Screenshot is required.');const fields={};document.querySelectorAll('[data-field]').forEach(e=>fields[e.dataset.field]=e.value);const{data:auth}=await supabaseClient.auth.getUser();if(!auth?.user)return alert('Login session expired.');const{data,error}=await supabaseClient.functions.invoke('submit-application',{body:{retailer_id:auth.user.id,service_name:selected.name,amount:Number(selected.amount||0),payment_status:'Pending',application_status:'Pending',utr_number:utr,fields,files}});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Application submission failed.');const tr=data.trNumber||data.tr_number||'-';const el=document.getElementById('tr')||document.getElementById('trNumber');if(el)el.textContent=tr;const box=document.getElementById('trBox')||document.querySelector('.tr');if(box)box.style.display='block';alert('Application submitted successfully. TR: '+tr);if(typeof loadApplicationHistory==='function')await loadApplicationHistory();else if(typeof loadHistory==='function')await loadHistory();}catch(e){console.error(e);alert(e.message||'Application submission failed.');}}
            function start(){document.title='AllInOneStop - Retailer Pro';const h=document.querySelector('h1');if(h)h.textContent='👑 AllInOneStop - Retailer Pro';patchLoad();filter();window.login=loginPro;window.submitApplication=submitPro;setInterval(()=>{patchLoad();filter()},1200)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();
          </script>'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('retailer.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/retailer-pro.js').write_text(js,encoding='utf-8')
          print('JS bytes',len(js))
          PY
          node --check /tmp/retailer-pro.js
          grep -q 'Retailer Pro' retailer.html
          grep -q 'Ration Card services are completely hidden' retailer.html || true
          echo 'Retailer Pro rebuild validation passed.'
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retailer.html
          git commit -m 'Rebuild retailer portal as Retailer Pro'
          git push
