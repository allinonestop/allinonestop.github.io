name: Repair Retailer Login
on:
  push:
    paths:
      - '.github/repair-retailer-login-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last good retailer portal
        shell: bash
        run: |
          set -euo pipefail
          git show 674e748fd7c6d7061cb5861a4fb233c0faeec39b:retailer.html > retailer.html
      - name: Make exactly three login buttons and a real submit form
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('retailer.html')
          s=p.read_text(encoding='utf-8')
          start='<!-- =====================================================\n     LOGIN\n===================================================== -->'
          end='<!-- =====================================================\n     APPLICATION AREA\n===================================================== -->'
          a=s.find(start)
          b=s.find(end)
          if a<0 or b<0 or b<=a: raise SystemExit(f'login markers not found: {a}, {b}')
          replacement='''<!-- =====================================================\n     LOGIN\n===================================================== -->\n\n<div id="loginCard" class="card" style="max-width:450px;margin:45px auto">\n  <h2>Retailer Login</h2>\n  <div id="loginMsg" class="status"></div>\n  <div class="login-mode-title">Select Login Mode</div>\n  <div class="login-modes" id="loginModes" role="radiogroup" aria-label="Login Mode">\n    <button type="button" class="login-mode-card active" data-mode="retailer" aria-pressed="true"><strong>👤 Retailer</strong></button>\n    <button type="button" class="login-mode-card" data-mode="super" aria-pressed="false"><strong>👑 Super Retailer</strong></button>\n    <button type="button" class="login-mode-card" data-mode="pro" aria-pressed="false"><strong>⭐ Retailer Pro</strong></button>\n  </div>\n  <form id="loginForm" autocomplete="on">\n    <label for="username">Retailer ID / Username</label>\n    <input id="username" placeholder="RET-XXXXXX" autocomplete="username" required>\n    <label for="password">Password</label>\n    <input id="password" type="password" autocomplete="current-password" required>\n    <button id="loginBtn" type="submit" class="primary" style="margin-top:6px;width:100%">Login</button>\n  </form>\n</div>\n\n'''
          s=s[:a]+replacement+s[b:]
          old=r'function setLoginMode\(mode\)\{[\s\S]*?\}\s*\n\s*function initLoginModes\(\)\{[\s\S]*?\}\s*\n'
          new='''function setLoginMode(mode){\n  selectedLoginMode=["retailer","super","pro"].includes(mode)?mode:"retailer";\n  document.querySelectorAll('.login-mode-card').forEach(c=>{\n    const active=c.dataset.mode===selectedLoginMode;\n    c.classList.toggle('active',active);\n    c.setAttribute('aria-pressed',active?'true':'false');\n  });\n}\nfunction initLoginModes(){setLoginMode(selectedLoginMode);}\n'''
          s,n=re.subn(old,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('mode function patch failed')
          marker='window.addEventListener(\n  "DOMContentLoaded",\n  async () => {'
          hook='''window.addEventListener("DOMContentLoaded",()=>{\n  initLoginModes();\n  const form=document.getElementById("loginForm");\n  if(form) form.addEventListener("submit",async e=>{e.preventDefault();await window.login();});\n});\n\n'''
          if marker not in s: raise SystemExit('DOM marker not found')
          s=s.replace(marker,hook+marker,1)
          if 'async function login(){' not in s: raise SystemExit('login function missing')
          p.write_text(s,encoding='utf-8')
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/retailer-final-check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/retailer-final-check.js
          test "$(grep -o 'data-mode="retailer"' retailer.html | wc -l)" -eq 1
          test "$(grep -o 'data-mode="super"' retailer.html | wc -l)" -eq 1
          test "$(grep -o 'data-mode="pro"' retailer.html | wc -l)" -eq 1
          test "$(grep -o 'id="loginBtn"' retailer.html | wc -l)" -eq 1
          test "$(grep -o 'id="loginForm"' retailer.html | wc -l)" -eq 1
      - name: Publish repaired retailer portal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retailer.html
          git commit -m 'Fix retailer login click and keep three modes'
          git push
