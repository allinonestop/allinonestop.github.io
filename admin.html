<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllInOneStop Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:30px auto;padding:18px}.box{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0001;margin-bottom:18px}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #d0d5dd;border-radius:8px}button,.btn{padding:11px 16px;background:#1769e0;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.logout{background:#475467}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px}.hidden{display:none}.msg{padding:12px;background:#eef5ff;border-radius:8px;margin-top:10px}.error{background:#fef3f2;color:#b42318}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="box" id="login"><div class="top"><h1>Admin Login</h1><a class="btn logout" href="index.html">Home</a></div><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><div id="lm"></div></div><div id="panel" class="hidden"><div class="box"><div class="top"><div><h1>Admin Panel</h1><div id="who"></div></div><button class="logout" onclick="logout()">Logout</button></div></div><div class="box"><h2>Create Retailer</h2><div class="grid"><div><label>Name</label><input id="rn" placeholder="Retailer full name"></div><div><label>Mobile</label><input id="rm" maxlength="10" placeholder="10 digit mobile"></div><div><label>Email</label><input id="re" type="email" placeholder="Retailer email"></div><div><label>Retailer Number</label><input id="rr" placeholder="e.g. RET001"></div></div><button onclick="createRetailer()">Create & Send Email</button><div id="cm"></div></div><div class="box"><div class="top"><h2>Applications</h2><button onclick="loadApps()">Refresh</button></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>TR</th><th>Service</th><th>Amount</th><th>Payment</th><th>Status</th><th>Remark</th><th>Save</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>const SUPABASE_URL="https://dixsmucrgnyuvudhymdj.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Pdfqt8QfkhprpEtyQJ8jLA_G_-V9D58";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function msg(el,t,e=false){el.innerHTML='<div class="msg '+(e?'error':'')+'">'+esc(t)+'</div>'}async function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value,l=document.getElementById('lm');if(!e||!p){msg(l,'Email and password are required.',true);return}const{data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error){msg(l,error.message,true);return}const{data:profile,error:pe}=await supabaseClient.from('profiles').select('full_name,role').eq('id',data.user.id).maybeSingle();if(pe||!profile||profile.role!=='admin'){await supabaseClient.auth.signOut();msg(l,'This account is not an admin account.',true);return}openPanel(profile,data.user)}async function openPanel(profile,user){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');document.getElementById('who').textContent='Logged in: '+(profile.full_name||user.email);await loadApps()}async function restore(){const{data}=await supabaseClient.auth.getSession();if(!data.session)return;const{data:p}=await supabaseClient.from('profiles').select('full_name,role').eq('id',data.session.user.id).maybeSingle();if(p&&p.role==='admin')openPanel(p,data.session.user)}async function logout(){await supabaseClient.auth.signOut();location.reload()}async function createRetailer(){const cm=document.getElementById('cm');const body={full_name:rn.value.trim(),mobile:rm.value.trim(),email:re.value.trim(),retailer_number:rr.value.trim()};if(!body.full_name||!body.mobile||!body.email||!body.retailer_number){msg(cm,'Please fill all retailer fields.',true);return}const{data:s}=await supabaseClient.auth.getSession();if(!s.session){msg(cm,'Admin session expired. Please login again.',true);return}const{data,error}=await supabaseClient.functions.invoke('admin-create-retailer',{body});if(error){msg(cm,error.message||'Retailer creation failed.',true);return}if(data?.error){msg(cm,data.error,true);return}msg(cm,'Retailer created successfully.');rn.value='';rm.value='';re.value='';rr.value=''}async function loadApps(){const r=document.getElementById('rows');r.innerHTML='<tr><td colspan="7">Loading...</td></tr>';const{data,error}=await supabaseClient.from('applications').select('tr_number,service_name,amount,payment_status,application_status,remark').order('created_at',{ascending:false});if(error){r.innerHTML='<tr><td colspan="7">'+esc(error.message)+'</td></tr>';return}if(!data?.length){r.innerHTML='<tr><td colspan="7">No applications yet.</td></tr>';return}r.innerHTML=data.map(a=>{const t=esc(a.tr_number);return '<tr><td>'+t+'</td><td>'+esc(a.service_name)+'</td><td>₹'+esc(a.amount)+'</td><td><select id="p-'+t+'"><option '+(a.payment_status==='Pending'?'selected':'')+'>Pending</option><option '+(a.payment_status==='Paid'?'selected':'')+'>Paid</option><option '+(a.payment_status==='Failed'?'selected':'')+'>Failed</option></select></td><td><select id="s-'+t+'"><option '+(a.application_status==='Received'?'selected':'')+'>Received</option><option '+(a.application_status==='Verification'?'selected':'')+'>Verification</option><option '+(a.application_status==='Processing'?'selected':'')+'>Processing</option><option '+(a.application_status==='Completed'?'selected':'')+'>Completed</option><option '+(a.application_status==='Rejected'?'selected':'')+'>Rejected</option></select></td><td><input id="r-'+t+'" value="'+esc(a.remark||'')+'"></td><td><button onclick="saveStatus(\''+t+'\')">Save</button></td></tr>'}).join('')}async function saveStatus(t){const{data:s}=await supabaseClient.auth.getSession();if(!s.session){alert('Admin session expired. Please login again.');return}const body={tr_number:t,payment_status:document.getElementById('p-'+t).value,application_status:document.getElementById('s-'+t).value,remark:document.getElementById('r-'+t).value};const{data,error}=await supabaseClient.functions.invoke('send-status-email',{body});if(error){alert(error.message);return}if(data?.error){alert(data.error);return}alert('Status updated.');loadApps()}restore();</script></body></html>
