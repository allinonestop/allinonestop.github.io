<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AllInOneStop Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#7c5cff20,transparent 30%),
    radial-gradient(circle at 90% 15%,#00d2ff18,transparent 30%),
    linear-gradient(135deg,#eef2ff,#f8fbff 45%,#ecfeff);
  color:#172033;
  min-height:100vh;
}

button,input,select{font:inherit}

button,.btn{
  padding:11px 16px;
  background:linear-gradient(135deg,#5b5cf0,#287cff);
  color:#fff;
  border:0;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  transition:.2s;
}

button:hover,.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px #3658ff30;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.logout{background:#475467}

.wrap{
  max-width:1200px;
  margin:25px auto;
  padding:15px;
}

.box{
  background:#ffffffee;
  padding:25px;
  border-radius:22px;
  box-shadow:0 15px 45px #26305018;
  margin-bottom:20px;
  border:1px solid #fff;
  backdrop-filter:blur(12px);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  color:#4f46e5;
}

h2{margin-top:0}

p{color:#667085}

label{
  font-size:13px;
  font-weight:800;
  color:#475467;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0 13px;
  border:1px solid #d9deea;
  border-radius:11px;
  font-size:14px;
  background:#fff;
}

input:focus,select:focus{
  outline:2px solid #c7d2fe;
  border-color:#6366f1;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.hidden{display:none!important}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  background:#ecfdf3;
  color:#087443;
  font-size:14px;
  font-weight:600;
}

.error{
  background:#fef2f2;
  color:#b42318;
}

.warning{
  background:#fffbeb;
  color:#92400e;
}

.hint{
  font-size:12px;
  color:#667085;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  background:#eef2ff;
  color:#4f46e5;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.online{
  display:inline-block;
  padding:6px 10px;
  background:#ecfdf3;
  color:#087443;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px #26305012;
  border:1px solid #eef0f5;
}

.stat-icon{
  font-size:28px;
}

.stat-number{
  font-size:30px;
  font-weight:900;
  margin-top:8px;
  color:#4f46e5;
}

.stat-title{
  color:#667085;
  font-size:13px;
  font-weight:700;
}

.credential{
  background:linear-gradient(135deg,#f5f3ff,#eff6ff);
  border:1px solid #dfe3ff;
  border-radius:15px;
  padding:16px;
  margin-top:15px;
}

.credential-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.cred{
  background:#fff;
  border-radius:11px;
  padding:12px;
  border:1px solid #e5e7eb;
}

.cred small{
  display:block;
  color:#667085;
  margin-bottom:4px;
}
