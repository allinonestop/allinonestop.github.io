<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllInOneStop</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1050px;margin:30px auto;padding:18px}.top{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 8px 30px #0001;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;background:#1769e0;color:#fff;padding:11px 15px;border-radius:8px;text-decoration:none;font-weight:700;border:0;cursor:pointer}.btn.secondary{background:#475467}.user{font-size:13px;color:#475467}.hero{text-align:center;padding:45px 10px 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 8px 25px #0001;text-align:center}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">AllInOneStop</div><div class="nav"><a class="btn" href="retailer.html">Retailer Login</a><a class="btn" href="admin.html">Admin Login</a><a class="btn" href="tracking.html">Tracking</a><button id="logoutBtn" class="btn secondary" style="display:none" onclick="logout()">Logout</button></div><div id="userBox" class="user"></div></div><div class="hero"><h1>AllInOneStop</h1><p>All Online Services in One Place</p></div><div class="cards"><div class="card"><h2>🏪 Retailer</h2><p>Retailer login and applications.</p><a class="btn" href="retailer.html">Retailer Login</a></div><div class="card"><h2>🔐 Admin</h2><p>Manage retailers, applications and payments.</p><a class="btn" href="admin.html">Admin Login</a></div><div class="card"><h2>🔎 Tracking</h2><p>Track application with TR number.</p><a class="btn" href="tracking.html">Track Application</a></div></div></div><script>const SUPABASE_URL="https://dixsmucrgnyuvudhymdj.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Pdfqt8QfkhprpEtyQJ8jLA_G_-V9D58";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);async function showSession(){const{data}=await supabaseClient.auth.getSession();if(data.session){document.getElementById("userBox").textContent="Logged in: "+(data.session.user.email||"");document.getElementById("logoutBtn").style.display="inline-block"}}async function logout(){await supabaseClient.auth.signOut();location.reload()}showSession();</script></body></html>
